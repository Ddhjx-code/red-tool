<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>月宫一夜</title>
<style>
/* ============================================================
   DESIGN TOKENS — §6.1 中国传统色, exact hexes, not re-tuned.
   Every color/spacing/radius/motion value below traces to a token.
   ============================================================ */
:root{
  /* palette (§6.1) */
  --moon-white:#EEF7F2;      /* 月白 */
  --robe-white:#F2F0E6;      /* 素衣 */
  --silver:#F1F0ED;          /* 银白 */
  --indigo-deep:#1A3A5F;     /* 青黛 */
  --indigo:#2A475F;          /* 黛青 */
  --mineral-blue:#2E5D8C;    /* 石青 */
  --osmanthus:#F8C471;       /* 缃绮 — the ONLY warm anchor */
  --cinnabar:#ED5126;        /* 朱红 — seal + ending-name accent ONLY */

  /* alpha derivations of palette colors (no new hues) */
  --veil-0:rgba(26,58,95,0);
  --veil-42:rgba(26,58,95,.42);
  --veil-70:rgba(26,58,95,.70);
  --veil-86:rgba(26,58,95,.86);
  --veil-94:rgba(26,58,95,.94);
  --line-14:rgba(238,247,242,.14);
  --line-26:rgba(238,247,242,.26);
  --line-44:rgba(238,247,242,.44);
  --txt-62:rgba(238,247,242,.62);
  --txt-44:rgba(238,247,242,.44);
  --txt-30:rgba(238,247,242,.30);
  --card-55:rgba(26,58,95,.55);
  --card-72:rgba(26,58,95,.72);
  --warm-88:rgba(248,196,113,.88);
  --warm-30:rgba(248,196,113,.30);
  --warm-14:rgba(248,196,113,.14);

  /* spacing — 4px base scale */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px;
  --sp-6:24px; --sp-7:28px; --sp-8:32px; --sp-10:40px; --sp-12:48px;

  /* type scale */
  --fs-kicker:11px; --fs-xs:12px; --fs-sm:13px; --fs-body:15px;
  --fs-lead:17px; --fs-h2:22px; --fs-display:34px;
  --lh-tight:1.35; --lh-body:1.85;
  --ls-kicker:.28em; --ls-title:.14em;

  /* radii */
  --r-sm:6px; --r-md:12px; --r-lg:18px; --r-pill:999px;

  /* motion — GPU-composited properties only (transform/opacity/filter) */
  --dur-fast:180ms; --dur-base:320ms; --dur-slow:640ms;
  --ease-out:cubic-bezier(.22,.61,.36,1);
  --ease-soft:cubic-bezier(.33,.02,.28,1);

  /* typefaces — system CJK classical serif, zero external fonts */
  --font-display:"Songti SC","STSong","Source Han Serif SC","Noto Serif CJK SC","SimSun",serif;
  --font-body:"Songti SC","STSong","Source Han Serif SC","Noto Serif CJK SC","SimSun",serif;
}

*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--indigo-deep);
  color:var(--moon-white);
  font-family:var(--font-body);
  font-size:var(--fs-body);
  line-height:var(--lh-body);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}

/* ---------- L1/L2/L3 canvas stage: full-viewport background ---------- */
#stage{
  position:fixed; inset:0; z-index:0;
  display:block; width:100%; height:100%;
}

/* ---------- UI: bottom sheet over the scene ---------- */
#ui{
  position:fixed; left:0; right:0; bottom:0; z-index:2;
  display:flex; flex-direction:column; justify-content:flex-end;
  max-height:100%;
  padding:0 var(--sp-5) calc(var(--sp-6) + env(safe-area-inset-bottom));
}
#ui::before{
  content:""; position:absolute; left:0; right:0; bottom:0; height:calc(100% + 34vh);
  background:linear-gradient(to top,
    var(--veil-94) 0%, var(--veil-86) 30%, var(--veil-70) 58%,
    var(--veil-42) 80%, var(--veil-0) 100%);
  pointer-events:none; z-index:-1;
}
/* the ending sheet is more transparent so the peak-brightness scene reads through */
#ui.sheet-light::before{
  background:linear-gradient(to top,
    var(--veil-86) 0%, var(--veil-70) 34%, var(--veil-42) 66%, var(--veil-0) 100%);
}

.view{display:none;}
.view.is-active{display:block; animation:rise var(--dur-slow) var(--ease-out) both;}
@keyframes rise{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:none;}}

/* ---------- intro ---------- */
.kicker{
  margin:0 0 var(--sp-3);
  font-size:var(--fs-kicker); letter-spacing:var(--ls-kicker);
  color:var(--txt-44); text-transform:none;
}
.intro-title{
  margin:0; font-family:var(--font-display);
  font-size:var(--fs-display); font-weight:600;
  letter-spacing:var(--ls-title); line-height:var(--lh-tight);
  color:var(--moon-white);
}
.intro-sub{
  margin:var(--sp-2) 0 0; font-size:var(--fs-lead);
  color:var(--warm-88); letter-spacing:.1em;
}
.intro-body{
  margin:var(--sp-5) 0 0; white-space:pre-line;
  font-size:var(--fs-body); line-height:var(--lh-body); color:var(--txt-62);
  max-width:34ch;
}
.rule{
  height:1px; margin:var(--sp-5) 0; border:0;
  background:linear-gradient(to right, var(--line-26), var(--veil-0));
}

/* ---------- resource bar ---------- */
.res-bar{
  display:flex; align-items:center; gap:var(--sp-5);
  margin:0 0 var(--sp-4); flex-wrap:wrap;
}
.res{display:flex; align-items:center; gap:var(--sp-2);}
.res-label{font-size:var(--fs-kicker); letter-spacing:.18em; color:var(--txt-44);}
.dots{display:flex; gap:var(--sp-1);}
.dot{
  width:7px; height:7px; border-radius:var(--r-pill);
  background:var(--line-14);
  transition:background var(--dur-base) var(--ease-out),
             box-shadow var(--dur-base) var(--ease-out),
             transform var(--dur-base) var(--ease-out);
}
.dot.on-warm{background:var(--osmanthus); box-shadow:0 0 8px var(--warm-30); transform:scale(1.18);}
.dot.on-cool{background:var(--moon-white); box-shadow:0 0 8px var(--line-26); transform:scale(1.18);}
.dot.on-silver{background:var(--silver); box-shadow:0 0 8px var(--line-26); transform:scale(1.18);}
.node-step{margin-left:auto; font-size:var(--fs-kicker); letter-spacing:.16em; color:var(--txt-30);}

/* ---------- node ---------- */
.node-title{
  margin:0 0 var(--sp-3); font-family:var(--font-display);
  font-size:var(--fs-h2); font-weight:600; letter-spacing:.1em;
  line-height:var(--lh-tight); color:var(--moon-white);
}
.node-text{
  margin:0 0 var(--sp-5); font-size:var(--fs-body);
  line-height:var(--lh-body); color:var(--txt-62); max-width:38ch;
}
.choice-list{display:flex; flex-direction:column; gap:var(--sp-3);}
.choice{
  appearance:none; -webkit-appearance:none;
  display:block; width:100%; text-align:left;
  padding:var(--sp-4) var(--sp-5);
  font-family:var(--font-body); font-size:var(--fs-body); line-height:1.6;
  color:var(--moon-white);
  background:var(--card-55);
  border:1px solid var(--line-14);
  border-radius:var(--r-md);
  cursor:pointer;
  transition:transform var(--dur-fast) var(--ease-out),
             border-color var(--dur-fast) var(--ease-out),
             background var(--dur-fast) var(--ease-out),
             opacity var(--dur-base) var(--ease-out);
  animation:rise var(--dur-slow) var(--ease-out) both;
}
.choice:hover{border-color:var(--warm-30); background:var(--card-72); transform:translateY(-2px);}
.choice:active{transform:translateY(1px); border-color:var(--warm-88);}
.choice:focus-visible{outline:2px solid var(--osmanthus); outline-offset:2px;}

/* ---------- outcome ---------- */
.outcome-text{
  margin:0 0 var(--sp-6); font-size:var(--fs-lead);
  line-height:var(--lh-body); color:var(--moon-white); max-width:36ch;
}
.delta-line{
  margin:0 0 var(--sp-5); font-size:var(--fs-sm);
  letter-spacing:.1em; color:var(--warm-88);
}

/* ---------- ending ---------- */
.end-name{
  margin:0; font-family:var(--font-display);
  font-size:var(--fs-display); font-weight:600; letter-spacing:var(--ls-title);
  line-height:var(--lh-tight); color:var(--cinnabar);
}
.end-cond{margin:var(--sp-3) 0 0; font-size:var(--fs-sm); color:var(--txt-44); letter-spacing:.08em;}
.end-stats{margin:var(--sp-4) 0 0; font-size:var(--fs-sm); color:var(--warm-88); letter-spacing:.08em;}
.end-text{
  margin:var(--sp-5) 0 0; font-size:var(--fs-body);
  line-height:var(--lh-body); color:var(--txt-62); max-width:38ch;
}
.end-know{
  margin:var(--sp-5) 0 0; padding:var(--sp-4) var(--sp-5);
  border-left:2px solid var(--warm-30); background:var(--card-55);
  border-radius:0 var(--r-sm) var(--r-sm) 0;
}
.end-know-t{margin:0 0 var(--sp-2); font-size:var(--fs-sm); color:var(--warm-88); letter-spacing:.1em;}
.end-know-x{margin:0; font-size:var(--fs-sm); line-height:1.8; color:var(--txt-62);}
.endings-list{display:flex; flex-wrap:wrap; gap:var(--sp-2); margin:var(--sp-5) 0 0;}
.ending-chip{
  padding:var(--sp-1) var(--sp-3); font-size:var(--fs-xs); letter-spacing:.08em;
  border:1px solid var(--line-14); border-radius:var(--r-pill); color:var(--txt-30);
}
.ending-chip.got{border-color:var(--warm-30); color:var(--warm-88);}

/* ---------- buttons ---------- */
.actions{display:flex; gap:var(--sp-3); margin-top:var(--sp-6); flex-wrap:wrap;}
.btn{
  appearance:none; -webkit-appearance:none;
  padding:var(--sp-3) var(--sp-6);
  font-family:var(--font-body); font-size:var(--fs-sm); letter-spacing:.16em;
  border-radius:var(--r-pill); cursor:pointer;
  transition:transform var(--dur-fast) var(--ease-out),
             border-color var(--dur-fast) var(--ease-out),
             opacity var(--dur-fast) var(--ease-out);
}
.btn:active{transform:translateY(1px);}
.btn:focus-visible{outline:2px solid var(--osmanthus); outline-offset:2px;}
.btn-primary{
  color:var(--indigo-deep); background:var(--osmanthus); border:1px solid var(--osmanthus);
  font-weight:600;
}
.btn-primary:hover{filter:brightness(1.06);}
.btn-ghost{
  color:var(--txt-62); background:var(--veil-0); border:1px solid var(--line-26);
}
.btn-ghost:hover{border-color:var(--line-44); color:var(--moon-white);}

/* ---------- share card ---------- */
.card-wrap{margin-top:var(--sp-6);}
.card-wrap img{
  display:block; width:100%; max-height:44vh; object-fit:contain;
  border:1px solid var(--line-14); border-radius:var(--r-md);
}
.card-note{margin:var(--sp-3) 0 0; font-size:var(--fs-xs); color:var(--txt-30); letter-spacing:.08em;}

.foot{
  margin:var(--sp-6) 0 0; font-size:var(--fs-xs);
  color:var(--txt-30); letter-spacing:.08em;
}

@media (prefers-reduced-motion: reduce){
  .view.is-active,.choice{animation:none;}
  .choice,.btn,.dot{transition:none;}
}
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div id="ui">

  <section id="view-intro" class="view is-active">
    <p class="kicker">非遗手作坊 · 中秋 · 唐人传奇</p>
    <h1 id="intro-title" class="intro-title"></h1>
    <p id="intro-sub" class="intro-sub"></p>
    <p id="intro-body" class="intro-body"></p>
    <hr class="rule" />
    <div class="actions">
      <button id="btn-start" class="btn btn-primary" type="button">开 始</button>
    </div>
    <p class="foot">三源两说不同 · 备录于此</p>
  </section>

  <section id="view-node" class="view">
    <div class="res-bar">
      <div class="res"><span class="res-label">暖意</span><span id="dots-warmth" class="dots"></span></div>
      <div class="res"><span class="res-label">记曲</span><span id="dots-tune" class="dots"></span></div>
      <div class="res"><span class="res-label">观舞</span><span id="dots-dance" class="dots"></span></div>
      <span id="node-step" class="node-step"></span>
    </div>
    <h2 id="node-title" class="node-title"></h2>
    <p id="node-text" class="node-text"></p>
    <div id="choice-list" class="choice-list"></div>
  </section>

  <section id="view-outcome" class="view">
    <div class="res-bar">
      <div class="res"><span class="res-label">暖意</span><span id="dots-warmth-o" class="dots"></span></div>
      <div class="res"><span class="res-label">记曲</span><span id="dots-tune-o" class="dots"></span></div>
      <div class="res"><span class="res-label">观舞</span><span id="dots-dance-o" class="dots"></span></div>
    </div>
    <p id="outcome-delta" class="delta-line"></p>
    <p id="outcome-text" class="outcome-text"></p>
    <div class="actions">
      <button id="btn-advance" class="btn btn-primary" type="button">继 续</button>
    </div>
  </section>

  <section id="view-ending" class="view">
    <p class="kicker">一夜将尽</p>
    <h2 id="end-name" class="end-name"></h2>
    <p id="end-cond" class="end-cond"></p>
    <p id="end-stats" class="end-stats"></p>
    <p id="end-text" class="end-text"></p>
    <div id="end-know" class="end-know">
      <p id="end-know-t" class="end-know-t"></p>
      <p id="end-know-x" class="end-know-x"></p>
    </div>
    <div id="endings-list" class="endings-list"></div>
    <div id="card-wrap" class="card-wrap"></div>
    <p id="card-note" class="card-note"></p>
    <div class="actions">
      <button id="btn-restart" class="btn btn-primary" type="button">再 游 一 夜</button>
      <button id="btn-home" class="btn btn-ghost" type="button">回 首 页</button>
      <button id="btn-save" class="btn btn-ghost" type="button">存 图</button>
      <button id="btn-note" class="btn btn-ghost" type="button">发 笔 记</button>
    </div>
    <p class="foot">唐人传奇 · 非史实 · 非遗手作坊</p>
  </section>

</div>

<script>
var D = {
  meta: {
    title: "月宫一夜",
    subtitle: "唐明皇游月宫",
    intro: "你是开元天子，素好音律。宫中所奏听了多年，你总觉得少些什么，像缺了半阙，寻遍人间也补不上。\n又闻月中有天乐，非人间所有。你欲一闻之。\n开元中秋，望夜月圆。罗公远掷杖化银桥，其色如银。\n桥上数十里，寒色侵人，走过的路随步而灭。\n月宫极寒。你身上那点暖意，决定你能在月里撑多久。暖意一旦散尽，便不能再进广寒，此夜作废，什么都带不走。\n你还能记下声调，也能看懂舞姿。声调记全，一句不缺，霓裳羽衣曲便可在人间完整重现；舞姿看懂，则是得其意而声调不全。\n这一夜只有一次，此后不可复得。"
  },

  nodes: {
    "start": {
      title: "宫中玩月",
      text: "八月十五望夜，你于宫中玩月。你素好音律，宫中所奏听了多年，总觉得少些什么。闻月中有天乐，非人间所有，你欲一闻之。罗公远忽奏曰：陛下莫要至月中看否。言毕取拄杖向空掷之，化为大桥，其色如银。",
      choices: [
        { text: "应公远之请，同登银桥", next: "bridge", outcome: "你随公远踏上桥头。桥体冰凉，银光随步而亮。你要听的那一段天乐，就在桥的尽头。" },
        { text: "婉拒，留在人间赏月", next: "stay", outcome: "你摇头。银桥悬了片刻，随即散去，只余庭中月色。宫中所奏仍旧少些什么，你不再去问。" },
        { text: "先问一句：月中何有", next: "bridge", warmth: -1, outcome: "公远答曰：有素娥数百，舞于广庭，天乐自桂影间出。你在阶前多立半晌，寒色先侵一层。" }
      ]
    },
    "stay": {
      title: "人间月色",
      text: "桥散了。庭中桂影不动，月色落在阶前，与寻常中秋并无不同。你坐回席上，听远处笙歌渐歇。宫中所奏，仍旧是你听了多年的那些，仍旧少些什么。",
      choices: [
        { text: "就这样坐到天明", next: "end_renjian", outcome: "夜尽了。你没有去月宫，也没有失去什么。那段天乐，你终究没有听到。" }
      ]
    },
    "bridge": {
      title: "银桥",
      text: "约行数十里，精光夺目，寒色侵人。走过的银桥随步而灭，一段段消隐，无处可退。前方大城阙渐渐显出，你要听的天乐就在那城里。身上暖意有限，寒色每侵一层，你能待的时辰便少一分。",
      choices: [
        { text: "目不斜视，径直前行", next: "gate", outcome: "你只看着前面。寒意未增，脚下的桥不再动摇。天乐近了。" },
        { text: "回头顾望一眼", next: "lookback", warmth: -1, outcome: "你回过头。身后已无桥，也无来路。这一眼换来一个认知：此路不可回头。寒气趁势侵了一层。" },
        { text: "折一枝桂携行", next: "gate", warmth: 1, outcome: "桂枝入手生温，香气抵住了寒色。只是你携着月宫之物，门前兵卫或会多看一眼。" }
      ]
    },
    "lookback": {
      title: "桥随步而灭",
      text: "却顾其桥，随步而灭。来路已尽，人间远在下方，只余一点灯火。此后不必再回头，回头也无路。你要听的天乐还在前面。",
      choices: [
        { text: "敛目，继续向前", next: "gate", outcome: "你收回目光。前方城阙渐近，心绪稍定。" }
      ]
    },
    "gate": {
      title: "广寒清虚之府",
      text: "城阙当前，榜曰广寒清虚之府。守门兵卫甚严，白刃粲然，望之如凝雪。门下寒气比桥上更盛，几乎不能久立。你要听的天乐就在门内广庭。强行越过白刃，极寒自门内涌出，暖意折损；止步其下，广庭便在门内自开，不惊动兵卫；求公远引路，寒色不增，只是这份实景是借来的。",
      choices: [
        { text: "越过白刃，强行入门", next: "force", warmth: -1, outcome: "你越过守门兵卫。极寒自门内涌出，几乎站不住脚。" },
        { text: "止步其下，不入", next: "court", outcome: "你在门下停住。广庭在门内展开，不惊动兵卫。这一景是你自己走到的。" },
        { text: "求公远引路", next: "court", outcome: "公远与兵卫低语数句，领你由侧径入。寒色未增，只是这份实景是借来的。" }
      ]
    },
    "force": {
      title: "极寒不可进",
      text: "门内寒如刀。你勉强行了数步，四肢渐僵，白刃与雪光混作一片。深处终究不得入，只能退回广庭之外。暖意又折了一分。",
      choices: [
        { text: "退回广庭", next: "court", outcome: "你退出门来。寒意仍在骨上，可广庭已在眼前，天乐已在耳畔。" }
      ]
    },
    "court": {
      title: "广庭",
      text: "广庭之中，素娥十余人，皓衣乘白鸾，往来笑舞于广陵大桂树之下。乐音清丽，自桂影间散出。这正是你多年所缺的那一段天乐。一夜只有一次，只能择一件事做。静立不动，声调可逐句记全，只是身形不动，寒气便一层层侵上来，暖意随之折损。近前走动去看舞姿，脚步不停反倒不耗暖意，然而声调拾不全，只得其神韵。开口一问，耗神伤暖，答的却只是一个曲名。",

  knowledge: [
    { title: "两说不同，乃备录于此", text: "游月宫一事，唐人至少有两个独立来源。《太平广记》卷二十二记罗公远取拄杖向空掷之，化为大桥，玄宗入月宫见仙女数百舞于广庭，密记其声调而回；《逸史》（转引于《杨太真外传》）则说公远取一枝桂掷之化桥。引路之物既异，年代亦不合。《杨太真外传》自己的处理是「以二说不同，乃备录于此」，原文承认矛盾，不作取舍。本作以《太平广记》罗公远版为主干。另须说明：桥上行时可折一枝桂御寒，此为本作演绎，原文并无此事。" },
    { title: "《龙城录》真伪存疑", text: "「广寒清虚之府」「守门兵卫甚严，白刃粲然」「极寒不可进」「次夜欲再求往，天师但笑谢不允」诸语，皆出自《龙城录·明皇梦游广寒宫》，旧题唐柳宗元撰。该书真伪历来存疑，后世学者多以为是依托之作，故只能视为唐人传奇一路的传说材料，不可当作信史。篇名自带「梦游」二字，原文亦自陈「忽悟若醉中梦回尔」，故事本身就标明这是一夜梦中之游。本作只取它的「不得入」「极寒」「次夜不允」作约束层，主干仍用《太平广记》。" },
    { title: "年代与日期的分歧", text: "三源日期一致指向八月十五：《太平广记》作「中秋望夜」，《龙城录》作「八月望日夜」，《逸史》作「八月十五日夜」，望日即十五。年代却彼此不合：《太平广记》作开元中，《龙城录》作开元六年，《逸史》作天宝初，相差近二十年，无从判定孰是。本作笼统标为「开元中秋」，是从其一，不是考定。另须说明：中秋成为民间盛节是宋代以后的事，节令饼食更晚至明代才见记载，唐代宫中并无这些节俗。" },
    { title: "求曲之欲，此为本作演绎", text: "玄宗好音律，此公认史实：《新唐书·礼乐志》称玄宗「既知音律，又酷爱法曲，选坐部伎子弟三百教于梨园」。霓裳羽衣曲亦屡见于唐人歌咏，白居易《霓裳羽衣歌》即咏此曲。然而此曲并非玄宗凭空创作：王灼《碧鸡漫志》卷三断曰「西涼創作，明皇潤色，又爲易美名」，杜佑《理道要诀》记天宝十三载（754）太常寺刊石，黃鐘商《婆罗门曲》改为《霓裳羽衣曲》——是西凉所进旧曲，玄宗润色而易其名，非其独创。至于游月宫一事的原文，并无求曲的动机。《太平广记》卷二十二只写罗公远进言「陛下莫要至月中看否」，玄宗遂与之俱往——他是因公远提议才去的，不是带着「欲闻天乐」的欲望登桥。本作把「素好音律、闻月中有天乐、欲一闻之」立为这一夜的动机，是为了让登桥、折桂御寒、广庭择一事、归后制曲串成一条因果链，属本作演绎，不得当作唐人原文所有。桥上行时可折一枝桂御寒，同为本作演绎（见第一则）。史实与演绎的分界在此：好音律、霓裳羽衣曲经玄宗润色易名是史实；此夜带着求曲的欲望登桥，是本作。" },
    { title: "月宫之说，宋人已辨其妄", text: "本作主干取自《太平广记》罗公远版，月宫闻乐一事本是唐人传奇。至宋，王灼《碧鸡漫志》卷三已明辨其妄：「《霓裳羽衣曲》，说者多异。予断之曰：西涼創作，明皇潤色，又爲易美名。其他饰以神怪者，皆不足信也。」又曰「月官事荒诞，惟西涼進《婆羅門曲》，明皇潤色，又爲易美名，最明白无疑。」在他看来，可征信者唯有西凉进曲、玄宗润色易名一节；月中闻乐、罗公远掷杖化桥诸说，皆「饰以神怪」，不足信。杜佑《理道要诀》所记天宝十三载太常寺刊石改名一事，王灼以为「係当时朝旨，可信不诬」。本作明知此辨，仍取月宫一说为叙事主干，是取其传奇之趣，非信其为史；读者当知此曲实出西凉，与月宫无涉。" },
    { title: "霓裳羽衣曲的调与结构", text: "此曲属黃鐘商，时号越调（王灼《碧鸡漫志》：「明皇改《婆羅門》爲《霓裳羽衣》，属黃鐘商……时号越调」），越调在燕乐二十八调中列七商之首。它是法曲：《新唐书·礼乐志》称法曲「其音清而近雅」，演奏时「其声金、石、丝、竹以次作」——众乐不齐，金石丝竹次第发声，白居易《霓裳羽衣歌》注亦云「凡法曲之初，众乐不齐，唯金石丝竹次第发声」。全曲十二遍：前六遍为散序，无拍，故不舞；第七遍起入中序（亦名拍序），始有拍而舞；末段繁音急节，然凡曲将终皆声拍促速，唯霓裳之末「长引一声」，引声益缓，与诸曲之遽终不同。唐末其谱已残缺，王灼谓「唐曲今世决不复见」，故任何「复原」皆属推测。" }
  ],

          var halo = Math.exp(-(md * md) / (MR * MR * 5.5)) * 0.62;
          var occ = open * rayVar * falloff * (disc * 1.7 + halo + 0.075);
          occ *= occluderTransmit(u, v);
          occ *= liftGain;
          var la = occ > 1.1 ? 1.1 : occ;
          if (la > 0) {
            r += la * (C.moonWhite[0] - r) * 0.78;
            g += la * (C.moonWhite[1] - g) * 0.78;
            b += la * (C.moonWhite[2] - b) * 0.78;
          }

          /* --- warmth hue shift: ADDITIVE only, so luminance never drops --- */
          r += cool * 4 + warm * 7;
          g += cool * 9 + warm * 4;
          b += cool * 15 + warm * 1;

          /* --- exposure: raises the scene mean so the vignette cannot net
             reduce brightness (§10 结尾即峰值) --- */
          r *= EXP; g *= EXP; b *= EXP;

          /* --- ordered dither, widened: THE anti-banding measure (§10) --- */
          var dth = (brow[x & 7] / 64 - 0.5) * 4.8;
          r += dth; g += dth; b += dth;

          var o = (y * FW + x) * 4;
          d[o] = r < 0 ? 0 : (r > 255 ? 255 : r);
          d[o + 1] = g < 0 ? 0 : (g > 255 ? 255 : g);
          d[o + 2] = b < 0 ? 0 : (b > 255 ? 255 : b);
          d[o + 3] = 255;
        }
      }
      fctx.putImageData(fimg, 0, 0);
      ctx.drawImage(field, 0, 0, W, H);
    }

    /* crisp full-resolution moon: 月轮 with limb rim light, not a flat disc */
    function renderMoon(tt) {
      var mx = W * MU, my = H * MV, mr = H * MR;

      var halo = ctx.createRadialGradient(mx, my, mr * 0.6, mx, my, mr * (5.2 + V.lift * 2.2));
      halo.addColorStop(0, rgba(C.moonWhite, 0.30 + V.lift * 0.14));
      halo.addColorStop(0.32, rgba(C.moonWhite, 0.11 + V.lift * 0.06));
      halo.addColorStop(1, rgba(C.moonWhite, 0));
      ctx.fillStyle = halo;
      ctx.beginPath(); ctx.arc(mx, my, mr * (5.2 + V.lift * 2.2), 0, TAU); ctx.fill();

      var body = ctx.createRadialGradient(mx - mr * 0.26, my - mr * 0.24, mr * 0.08, mx, my, mr);
      body.addColorStop(0, "#FFFFFF");
      body.addColorStop(0.55, rgba(C.moonWhite, 1));
      body.addColorStop(0.92, rgba(C.silver, 1));
      body.addColorStop(1, rgba(C.mineralBlue, 0.55));
      ctx.fillStyle = body;
      ctx.beginPath(); ctx.arc(mx, my, mr, 0, TAU); ctx.fill();

      /* mare texture — seeded fbm, deterministic */
      ctx.save();
      ctx.beginPath(); ctx.arc(mx, my, mr, 0, TAU); ctx.clip();
      var seedM = (SEED ^ 0xA001) >>> 0;
      for (var i = 0; i < 9; i++) {
        var nx = ihash(i, 3, seedM), ny = ihash(i, 11, seedM), nr = ihash(i, 29, seedM);
        var px = mx + (nx - 0.5) * mr * 1.5, py = my + (ny - 0.5) * mr * 1.5;
        var pr = mr * (0.10 + nr * 0.26);
        var mg = ctx.createRadialGradient(px, py, 0, px, py, pr);
        mg.addColorStop(0, rgba(C.mineralBlue, 0.16));
        mg.addColorStop(1, rgba(C.mineralBlue, 0));
        ctx.fillStyle = mg;
        ctx.beginPath(); ctx.arc(px, py, pr, 0, TAU); ctx.fill();
      }
      ctx.restore();

      /* 月轮轮廓光 — rim light on the disc limb */
      ctx.strokeStyle = rgba(C.moonWhite, 0.85);
      ctx.lineWidth = Math.max(1, mr * 0.045);
      ctx.beginPath(); ctx.arc(mx, my, mr * 0.985, 0, TAU); ctx.stroke();
    }

    /* additive bloom — 结尾即峰值 express only via brightening (§10) */
    function renderBloom() {
      if (V.lift <= 0.01) return;
      var mx = W * MU, my = H * MV;
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      var bg = ctx.createRadialGradient(mx, my, 0, mx, my, H * 0.95);
      bg.addColorStop(0, rgba(C.moonWhite, 0.20 * V.lift));
      bg.addColorStop(0.42, rgba(C.moonWhite, 0.07 * V.lift));
      bg.addColorStop(1, rgba(C.moonWhite, 0));
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);
      /* warm anchor wash at high warmth — additive, never a darkening pass */
      if (V.warmth >= 2) {
        var wg = ctx.createRadialGradient(W * 0.5, H * 0.62, 0, W * 0.5, H * 0.62, H * 0.7);
        wg.addColorStop(0, rgba(C.osmanthus, 0.045 * (V.warmth / 3) * (0.5 + V.lift)));
        wg.addColorStop(1, rgba(C.osmanthus, 0));
        ctx.fillStyle = wg;
        ctx.fillRect(0, 0, W, H);
      }
      ctx.restore();
    }

    /* ======================= L2 — scene subject ======================= */

    function rr(g, x, y, w, h, r) {
      var k = Math.min(r, w / 2, h / 2);
      g.beginPath();
      g.moveTo(x + k, y);
      g.lineTo(x + w - k, y); g.quadraticCurveTo(x + w, y, x + w, y + k);
      g.lineTo(x + w, y + h - k); g.quadraticCurveTo(x + w, y + h, x + w - k, y + h);
      g.lineTo(x + k, y + h); g.quadraticCurveTo(x, y + h, x, y + h - k);
      g.lineTo(x, y + k); g.quadraticCurveTo(x, y, x + k, y);
      g.closePath();
    }

    /* 银桥 — volumetric body + god rays + mist, vanishing segment by segment (§6.3) */
    var SEG_N = 14;

    function bridgePoint(t) {
      var x = W * (0.05 + 0.92 * t);
      var y = H * (0.735 - 0.425 * t) + Math.sin(t * Math.PI) * H * 0.022;
      var w = H * 0.046 * (1 - t * 0.56);
      return { x: x, y: y, w: w };
    }

    function drawBridge(tt) {
      var gone = V.progress * SEG_N;
      var mx = W * MU, my = H * MV;

      /* mist bands under the bridge — the 雾气光线 layer */
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      for (var m = 0; m < 5; m++) {
        var my2 = H * (0.70 + m * 0.035);
        var mg = ctx.createLinearGradient(0, my2 - H * 0.03, 0, my2 + H * 0.03);
        mg.addColorStop(0, rgba(C.moonWhite, 0));
        mg.addColorStop(0.5, rgba(C.moonWhite, 0.045 + 0.02 * Math.sin(tt * 0.35 + m)));
        mg.addColorStop(1, rgba(C.moonWhite, 0));
        ctx.fillStyle = mg;
        ctx.fillRect(0, my2 - H * 0.03, W, H * 0.06);
      }
      ctx.restore();

      /* god rays crossing the bridge — per-beam fbm variance, not a stamped radial */
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      for (var b = 0; b < 7; b++) {
        var a0 = -0.42 + b * 0.24;
        var rv = 0.30 + 1.25 * fbm(b * 1.9, tt * 0.06, (SEED ^ 0x50DA) >>> 0);
        var len = H * (0.55 + rv * 0.45);
        var ex = mx + Math.cos(a0 + 1.15) * len, ey = my + Math.sin(a0 + 1.15) * len;
        var wg = ctx.createLinearGradient(mx, my, ex, ey);
        wg.addColorStop(0, rgba(C.moonWhite, 0.13 * rv * (0.8 + V.lift * 0.5)));
        wg.addColorStop(0.55, rgba(C.moonWhite, 0.045 * rv));
        wg.addColorStop(1, rgba(C.moonWhite, 0));
        ctx.fillStyle = wg;
        ctx.beginPath();
        ctx.moveTo(mx, my);
        var spread = 0.055 + rv * 0.035;
        ctx.lineTo(ex + Math.cos(a0 + 1.15 + Math.PI / 2) * len * spread,
          ey + Math.sin(a0 + 1.15 + Math.PI / 2) * len * spread);
        ctx.lineTo(ex - Math.cos(a0 + 1.15 + Math.PI / 2) * len * spread,
          ey - Math.sin(a0 + 1.15 + Math.PI / 2) * len * spread);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();

      /* bridge deck — segment by segment, 随步而灭 */
      for (var i = 0; i < SEG_N; i++) {
        var t0 = i / SEG_N, t1 = (i + 1) / SEG_N;
        var vanish = gone - i;                     /* >0 => this segment is behind us */
        var alpha;
        if (vanish >= 1) alpha = 0;
        else if (vanish > 0) alpha = (1 - vanish) * 0.92;
        else alpha = 0.92;
        if (alpha <= 0.004) {
          /* residual shimmer where the bridge already went — the memory of the path */
          var rp = bridgePoint((t0 + t1) / 2);
          ctx.save();
          ctx.globalCompositeOperation = "lighter";
          ctx.fillStyle = rgba(C.silver, 0.05 * Math.max(0, 1 + vanish * 0.6));
          ctx.beginPath(); ctx.ellipse(rp.x, rp.y, rp.w * 1.4, rp.w * 0.4, 0, 0, TAU); ctx.fill();
          ctx.restore();
          continue;
        }

        var p0 = bridgePoint(t0), p1 = bridgePoint(t1);
        var tilt = Math.atan2(p1.y - p0.y, p1.x - p0.x);

        /* volumetric under-glow so the deck reads as a light body, not a grey band */
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        var ug = ctx.createLinearGradient(p0.x, p0.y, p0.x, p0.y + H * 0.10);
        ug.addColorStop(0, rgba(C.moonWhite, 0.20 * alpha));
        ug.addColorStop(1, rgba(C.moonWhite, 0));
        ctx.fillStyle = ug;
        ctx.beginPath();
        ctx.ellipse((p0.x + p1.x) / 2, p0.y + H * 0.02, (p1.x - p0.x) * 0.9, H * 0.075, tilt, 0, TAU);
        ctx.fill();
        ctx.restore();

        /* deck plate */
        ctx.save();
        ctx.translate(p0.x, p0.y); ctx.rotate(tilt);
        var segLen = Math.sqrt((p1.x - p0.x) * (p1.x - p0.x) + (p1.y - p0.y) * (p1.y - p0.y));
        var pg = ctx.createLinearGradient(0, -p0.w * 0.5, 0, p0.w * 0.5);
        pg.addColorStop(0, rgba(C.moonWhite, alpha));
        pg.addColorStop(0.45, rgba(C.silver, alpha * 0.94));
        pg.addColorStop(1, rgba(C.mineralBlue, alpha * 0.42));
        ctx.fillStyle = pg;
        ctx.fillRect(0, -p0.w * 0.32, segLen + 1, p0.w * 0.64);
        /* top edge highlight — the rim that separates it from the dark */
        ctx.fillStyle = rgba(C.moonWhite, alpha * 0.95);
        ctx.fillRect(0, -p0.w * 0.32, segLen + 1, Math.max(1, p0.w * 0.10));
        ctx.restore();

        /* balustrade posts */
        ctx.strokeStyle = rgba(C.silver, alpha * 0.55);
        ctx.lineWidth = Math.max(1, p0.w * 0.055);
        var px = p0.x + (p1.x - p0.x) * 0.5, py = p0.y + (p1.y - p0.y) * 0.5;
        ctx.beginPath();
        ctx.moveTo(px, py - p0.w * 0.32);
        ctx.lineTo(px, py - p0.w * 0.32 - p0.w * 0.55);
        ctx.stroke();
      }
    }

    /* 广寒清虚之府 — 仰视 grandeur + 兵卫白刃粲然，望之如凝雪 */
    function drawGate(tt) {
      var cx = W * 0.5, baseY = H * 0.80, topY = H * 0.30;
      var hw = W * 0.30;

      /* backlight column behind the gate — separation from the dark */
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      var bg = ctx.createLinearGradient(cx, topY, cx, baseY);
      bg.addColorStop(0, rgba(C.moonWhite, 0.16 + V.lift * 0.08));
      bg.addColorStop(1, rgba(C.moonWhite, 0.02));
      ctx.fillStyle = bg;
      ctx.beginPath();
      ctx.moveTo(cx - hw * 1.5, baseY);
      ctx.lineTo(cx - hw * 0.55, topY);
      ctx.lineTo(cx + hw * 0.55, topY);
      ctx.lineTo(cx + hw * 1.5, baseY);
      ctx.closePath(); ctx.fill();
      ctx.restore();

      /* towers — converging upward for the 仰视 read */
      [-1, 1].forEach(function (s) {
        var tx = cx + s * hw;
        ctx.fillStyle = rgba(C.indigo, 0.94);
        ctx.beginPath();
        ctx.moveTo(tx - s * hw * 0.30, baseY);
        ctx.lineTo(tx - s * hw * 0.20, topY + H * 0.05);
        ctx.lineTo(tx + s * hw * 0.22, topY + H * 0.05);
        ctx.lineTo(tx + s * hw * 0.34, baseY);
        ctx.closePath(); ctx.fill();
        /* moon-facing rim light — the anti-mud lever on architecture */
        ctx.strokeStyle = rgba(C.moonWhite, 0.72);
        ctx.lineWidth = Math.max(1.2, W * 0.004);
        ctx.beginPath();
        ctx.moveTo(tx - s * hw * 0.20, topY + H * 0.05);
        ctx.lineTo(tx - s * hw * 0.30, baseY);
        ctx.stroke();
      });

      /* roof with upturned eaves */
      ctx.fillStyle = rgba(C.indigoDeep, 0.96);
      ctx.beginPath();
      ctx.moveTo(cx - hw * 1.28, topY + H * 0.055);
      ctx.quadraticCurveTo(cx, topY - H * 0.045, cx + hw * 1.28, topY + H * 0.055);
      ctx.quadraticCurveTo(cx, topY + H * 0.012, cx - hw * 1.28, topY + H * 0.055);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = rgba(C.silver, 0.60);
      ctx.lineWidth = Math.max(1, W * 0.003);
      ctx.beginPath();
      ctx.moveTo(cx - hw * 1.28, topY + H * 0.055);
      ctx.quadraticCurveTo(cx, topY - H * 0.045, cx + hw * 1.28, topY + H * 0.055);
      ctx.stroke();

      /* portal — low-key interior that still keeps detail */
      var pw = hw * 0.62, ph = H * 0.26, px = cx - pw / 2, py = baseY - ph;
      var ig = ctx.createLinearGradient(px, py, px, py + ph);
      ig.addColorStop(0, rgba(C.mineralBlue, 0.52));
      ig.addColorStop(1, rgba(C.indigoDeep, 0.86));
      ctx.fillStyle = ig;
      ctx.beginPath();
      ctx.moveTo(px, py + ph);
      ctx.lineTo(px, py + pw * 0.32);
      ctx.quadraticCurveTo(cx, py - pw * 0.16, px + pw, py + pw * 0.32);
      ctx.lineTo(px + pw, py + ph);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = rgba(C.moonWhite, 0.55);
      ctx.lineWidth = Math.max(1, W * 0.003);
      ctx.stroke();

      /* blank plaque — rim-lit frame, no text drawn on canvas */
      rr(ctx, cx - hw * 0.34, topY + H * 0.075, hw * 0.68, H * 0.055, W * 0.006);
      ctx.fillStyle = rgba(C.indigoDeep, 0.92); ctx.fill();
      ctx.strokeStyle = rgba(C.silver, 0.58);
      ctx.lineWidth = Math.max(1, W * 0.0028); ctx.stroke();

      /* 兵卫白刃 — guards as silhouettes, blades catching moonlight */
      for (var i = 0; i < 3; i++) {
        var gx = cx + (i - 1) * hw * 0.34, gy = baseY;
        var gh = H * 0.115;
        ctx.fillStyle = rgba(C.indigoDeep, 0.92);
        ctx.beginPath();
        ctx.moveTo(gx - W * 0.018, gy);
        ctx.lineTo(gx - W * 0.011, gy - gh * 0.62);
        ctx.quadraticCurveTo(gx, gy - gh * 0.80, gx + W * 0.011, gy - gh * 0.62);
        ctx.lineTo(gx + W * 0.018, gy);
        ctx.closePath(); ctx.fill();
        /* rim light on the guard silhouette */
        ctx.strokeStyle = rgba(C.moonWhite, 0.66);
        ctx.lineWidth = Math.max(1, W * 0.0026);
        ctx.beginPath();
        ctx.moveTo(gx - W * 0.011, gy - gh * 0.62);
        ctx.quadraticCurveTo(gx, gy - gh * 0.80, gx + W * 0.011, gy - gh * 0.62);
        ctx.stroke();
        /* 白刃 — 望之如凝雪 */
        var sway = Math.sin(tt * 0.5 + i * 1.7) * W * 0.004;
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        var bl = ctx.createLinearGradient(gx, gy - gh * 0.55, gx + sway, gy - gh * 1.35);
        bl.addColorStop(0, rgba(C.silver, 0.55));
        bl.addColorStop(0.7, rgba(C.moonWhite, 0.95));
        bl.addColorStop(1, rgba(C.moonWhite, 0.15));
        ctx.fillStyle = bl;
        ctx.beginPath();
        ctx.moveTo(gx - W * 0.004, gy - gh * 0.55);
        ctx.lineTo(gx + sway, gy - gh * 1.38);
        ctx.lineTo(gx + W * 0.004, gy - gh * 0.55);
        ctx.closePath(); ctx.fill();
        ctx.restore();
      }
    }

    /* 广陵大桂树 — only branches sway (§6.5: never shake the whole tree) */
    function drawTree(tt) {
      var bx = W * 0.47, by = H * 0.63;
      var th = H * 0.30;

      ctx.strokeStyle = rgba(C.indigoDeep, 0.95);
      ctx.lineWidth = Math.max(2, W * 0.016);
      ctx.beginPath();
      ctx.moveTo(bx, by);
      ctx.quadraticCurveTo(bx - W * 0.02, by - th * 0.55, bx + W * 0.012, by - th);
      ctx.stroke();
      /* trunk rim light */
      ctx.strokeStyle = rgba(C.moonWhite, 0.42);
      ctx.lineWidth = Math.max(1, W * 0.0035);
      ctx.beginPath();
      ctx.moveTo(bx - W * 0.006, by);
      ctx.quadraticCurveTo(bx - W * 0.026, by - th * 0.55, bx + W * 0.006, by - th);
      ctx.stroke();

      for (var i = 0; i < treeSeed.length; i++) {
        var sd = treeSeed[i];
        var startY = by - th * (0.32 + sd.a * 0.66);
        var dir = i % 2 === 0 ? -1 : 1;
        var len = th * 0.30 * sd.l;
        var sway = Math.sin(tt * 0.6 + i * 0.9) * W * 0.006 * sd.w;   /* branch tips only */
        var ex = bx + dir * len * 0.9 + sway, ey = startY - len * 0.42;
        ctx.strokeStyle = rgba(C.indigoDeep, 0.82);
        ctx.lineWidth = Math.max(1, W * 0.005 * sd.l);
        ctx.beginPath();
        ctx.moveTo(bx + W * 0.008, startY);
        ctx.quadraticCurveTo(bx + dir * len * 0.5, startY - len * 0.1, ex, ey);
        ctx.stroke();
        /* canopy leaf cluster — rim-lit against the dark */
        var cg = ctx.createRadialGradient(ex, ey, 0, ex, ey, len * 0.52);
        cg.addColorStop(0, rgba(C.moonWhite, 0.20));
        cg.addColorStop(0.55, rgba(C.mineralBlue, 0.22));
        cg.addColorStop(1, rgba(C.mineralBlue, 0));
        ctx.fillStyle = cg;
        ctx.beginPath(); ctx.arc(ex, ey, len * 0.52, 0, TAU); ctx.fill();
      }
    }

    /* 素娥皓衣乘白鸾 — rim light + backlight is the #1 anti-mud lever (§6.5) */
    function drawSuE(g, x, y, s, ph, tt) {
      var bob = Math.sin(tt * 0.7 + ph) * s * 0.05;   /* stays near its anchor (§6.5) */
      y += bob;

      /* 1. backlight halo — separates the white robe from the dark ground */
      var halo = g.createRadialGradient(x, y - s * 0.15, s * 0.06, x, y - s * 0.15, s * 1.65);
      halo.addColorStop(0, rgba(C.moonWhite, 0.34 + V.lift * 0.12));
      halo.addColorStop(0.48, rgba(C.moonWhite, 0.11));
      halo.addColorStop(1, rgba(C.moonWhite, 0));
      g.fillStyle = halo;
      g.beginPath(); g.arc(x, y - s * 0.15, s * 1.65, 0, TAU); g.fill();

      /* 2. 白鸾 mount — silhouette then rim */
      g.fillStyle = rgba(C.indigoDeep, 0.90);
      g.beginPath();
      g.moveTo(x - s * 0.62, y + s * 0.30);
      g.quadraticCurveTo(x, y + s * 0.62, x + s * 0.66, y + s * 0.24);
      g.quadraticCurveTo(x + s * 0.30, y + s * 0.16, x - s * 0.62, y + s * 0.30);
      g.closePath(); g.fill();
      g.strokeStyle = rgba(C.moonWhite, 0.78);
      g.lineWidth = Math.max(1, s * 0.045);
      g.beginPath();
      g.moveTo(x - s * 0.62, y + s * 0.30);
      g.quadraticCurveTo(x, y + s * 0.62, x + s * 0.66, y + s * 0.24);
      g.stroke();
      /* wing — tapered, rim-lit */
      g.fillStyle = rgba(C.silver, 0.55);
      g.beginPath();
      g.moveTo(x + s * 0.10, y + s * 0.22);
      g.quadraticCurveTo(x + s * 0.85, y - s * 0.10 + Math.sin(tt * 1.1 + ph) * s * 0.08, x + s * 0.95, y + s * 0.34);
      g.quadraticCurveTo(x + s * 0.55, y + s * 0.30, x + s * 0.10, y + s * 0.22);
      g.closePath(); g.fill();

      /* 3. robe body — 素衣 */
      var robe = g.createLinearGradient(x, y - s * 0.9, x, y + s * 0.35);
      robe.addColorStop(0, rgba(C.robeWhite, 0.96));
      robe.addColorStop(0.62, rgba(C.robeWhite, 0.80));
      robe.addColorStop(1, rgba(C.mineralBlue, 0.55));
      g.fillStyle = robe;
      g.beginPath();
      g.moveTo(x, y - s * 0.92);
      g.quadraticCurveTo(x + s * 0.34, y - s * 0.52, x + s * 0.40, y + s * 0.26);
      g.quadraticCurveTo(x, y + s * 0.44, x - s * 0.40, y + s * 0.26);
      g.quadraticCurveTo(x - s * 0.34, y - s * 0.52, x, y - s * 0.92);
      g.closePath(); g.fill();

      /* 4. RIM LIGHT — moon-facing contour, the decisive separation stroke */
      g.strokeStyle = rgba(C.moonWhite, 0.97);
      g.lineWidth = Math.max(1.2, s * 0.058);
      g.beginPath();
      g.moveTo(x, y - s * 0.92);
      g.quadraticCurveTo(x - s * 0.34, y - s * 0.52, x - s * 0.40, y + s * 0.26);
      g.stroke();
      g.strokeStyle = rgba(C.moonWhite, 0.62);
      g.lineWidth = Math.max(1, s * 0.036);
      g.beginPath();
      g.moveTo(x, y - s * 0.92);
      g.quadraticCurveTo(x + s * 0.34, y - s * 0.52, x + s * 0.40, y + s * 0.26);
      g.stroke();

      /* 5. head + sleeve ribbons, both rim-lit */
      g.fillStyle = rgba(C.robeWhite, 0.95);
      g.beginPath(); g.arc(x, y - s * 0.98, s * 0.16, 0, TAU); g.fill();
      g.strokeStyle = rgba(C.moonWhite, 0.9);
      g.lineWidth = Math.max(1, s * 0.032);
      g.beginPath(); g.arc(x, y - s * 0.98, s * 0.16, Math.PI * 0.9, Math.PI * 1.9); g.stroke();

      g.strokeStyle = rgba(C.robeWhite, 0.42);
      g.lineWidth = Math.max(1, s * 0.05);
      var rib = Math.sin(tt * 0.9 + ph) * s * 0.16;
      g.beginPath();
      g.moveTo(x - s * 0.30, y - s * 0.44);
      g.quadraticCurveTo(x - s * 0.80, y - s * 0.30 + rib, x - s * 1.05, y - s * 0.02 + rib);
      g.stroke();
    }

    /* 广庭 · 素娥十余人舞于广陵大桂树之下 (远景, 平视) */
    function drawCourt(tt) {
      /* terrace floor — atmospheric depth, low-key not black-key */
      var fg = ctx.createLinearGradient(0, H * 0.63, 0, H);
      fg.addColorStop(0, rgba(C.mineralBlue, 0.34));
      fg.addColorStop(0.55, rgba(C.indigo, 0.55));
      fg.addColorStop(1, rgba(C.indigoDeep, 0.72));
      ctx.fillStyle = fg;
      ctx.fillRect(0, H * 0.63, W, H * 0.37);
      ctx.strokeStyle = rgba(C.moonWhite, 0.26);
      ctx.lineWidth = Math.max(1, W * 0.0025);
      for (var i = 0; i < 6; i++) {
        var ly = H * (0.66 + i * 0.055);
        ctx.beginPath();
        ctx.moveTo(0, ly);
        ctx.bezierCurveTo(W * 0.3, ly + 3, W * 0.7, ly - 3, W, ly);
        ctx.stroke();
      }

      drawTree(tt);

      /* 素娥 — kept near the anchor centre (§6.5: no long-distance travel) */
      var anchors = [
        { x: 0.30, y: 0.55, s: 0.062 }, { x: 0.47, y: 0.50, s: 0.078 },
        { x: 0.64, y: 0.55, s: 0.064 }, { x: 0.38, y: 0.62, s: 0.052 },
        { x: 0.58, y: 0.62, s: 0.054 }
      ];
      for (var k = 0; k < anchors.length; k++) {
        var a = anchors[k];
        drawSuE(ctx, W * a.x, H * a.y, H * a.s, k * 1.3, tt);
      }
    }

    /* 人间 · 宫中玩月 terrace */
    function drawTerrace(tt) {
      var hy = H * 0.74;
      var fg = ctx.createLinearGradient(0, hy, 0, H);
      fg.addColorStop(0, rgba(C.indigo, 0.60));
      fg.addColorStop(1, rgba(C.indigoDeep, 0.80));
      ctx.fillStyle = fg;
      ctx.fillRect(0, hy, W, H - hy);

      /* distant palace roofline */
      ctx.fillStyle = rgba(C.indigoDeep, 0.92);
      ctx.beginPath();
      ctx.moveTo(0, hy);
      ctx.lineTo(W * 0.10, hy - H * 0.055);
      ctx.quadraticCurveTo(W * 0.24, hy - H * 0.10, W * 0.38, hy - H * 0.045);
      ctx.lineTo(W * 0.38, hy);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = rgba(C.moonWhite, 0.55);
      ctx.lineWidth = Math.max(1, W * 0.003);
      ctx.beginPath();
      ctx.moveTo(W * 0.10, hy - H * 0.055);
      ctx.quadraticCurveTo(W * 0.24, hy - H * 0.10, W * 0.38, hy - H * 0.045);
      ctx.stroke();

      /* balustrade — moon-caught rail */
      ctx.strokeStyle = rgba(C.silver, 0.44);
      ctx.lineWidth = Math.max(1, W * 0.0035);
      ctx.beginPath(); ctx.moveTo(0, hy + H * 0.035); ctx.lineTo(W, hy + H * 0.035); ctx.stroke();
      for (var i = 0; i < 9; i++) {
        var px = W * (0.06 + i * 0.11);
        ctx.beginPath();
        ctx.moveTo(px, hy + H * 0.035);
        ctx.lineTo(px, hy + H * 0.115);
        ctx.stroke();
      }

      /* moon reflection on the terrace stone — the single warm-ish anchor stays gold */
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      var rx = W * MU, ry = hy + H * 0.10;
      var rg = ctx.createRadialGradient(rx, ry, 0, rx, ry, W * 0.30);
      rg.addColorStop(0, rgba(C.moonWhite, 0.16));
      rg.addColorStop(1, rgba(C.moonWhite, 0));
      ctx.fillStyle = rg;
      ctx.beginPath(); ctx.ellipse(rx, ry, W * 0.30, H * 0.055, 0, 0, TAU); ctx.fill();
      ctx.restore();
    }

    /* 归途 · 三人下若旋风 */
    function drawDescent(tt) {
      drawBridge(tt);
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      var cx = W * 0.5, cy = H * 0.52;
      for (var i = 0; i < 9; i++) {
        var p = ((tt * 0.22 + i * 0.111) % 1);
        var rad = H * (0.06 + p * 0.40);
        var a = (1 - p) * 0.24;
        ctx.strokeStyle = rgba(C.moonWhite, a);
        ctx.lineWidth = Math.max(1, W * 0.0028 * (1 - p));
        ctx.beginPath();
        ctx.arc(cx, cy, rad, tt * 0.5 + i, tt * 0.5 + i + Math.PI * 1.15);
        ctx.stroke();
      }
      ctx.restore();
    }

    /* 次夜 · 天师笑谢不允 — a second, withheld moon */
    function drawSecond(tt) {
      var sx = W * 0.24, sy = H * 0.30, sr = H * 0.045;
      var halo = ctx.createRadialGradient(sx, sy, sr * 0.4, sx, sy, sr * 4.2);
      halo.addColorStop(0, rgba(C.moonWhite, 0.18));
      halo.addColorStop(1, rgba(C.moonWhite, 0));
      ctx.fillStyle = halo;
      ctx.beginPath(); ctx.arc(sx, sy, sr * 4.2, 0, TAU); ctx.fill();
      ctx.fillStyle = rgba(C.silver, 0.72);
      ctx.beginPath(); ctx.arc(sx, sy, sr, 0, TAU); ctx.fill();
      ctx.strokeStyle = rgba(C.moonWhite, 0.8);
      ctx.lineWidth = Math.max(1, sr * 0.06);
      ctx.beginPath(); ctx.arc(sx, sy, sr * 0.98, 0, TAU); ctx.stroke();

      /* distant shut gate */
      ctx.save();
      ctx.globalAlpha = 0.55;
      var cx = W * 0.66, baseY = H * 0.70, hw = W * 0.16;
      ctx.fillStyle = rgba(C.indigoDeep, 0.95);
      ctx.beginPath();
      ctx.moveTo(cx - hw, baseY);
      ctx.lineTo(cx - hw * 0.8, baseY - H * 0.20);
      ctx.lineTo(cx + hw * 0.8, baseY - H * 0.20);
      ctx.lineTo(cx + hw, baseY);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = rgba(C.moonWhite, 0.5);
      ctx.lineWidth = Math.max(1, W * 0.003);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(cx - hw * 1.15, baseY - H * 0.20);
      ctx.quadraticCurveTo(cx, baseY - H * 0.27, cx + hw * 1.15, baseY - H * 0.20);
      ctx.stroke();
      ctx.restore();

      /* cold floor */
      var fg = ctx.createLinearGradient(0, H * 0.70, 0, H);
      fg.addColorStop(0, rgba(C.indigo, 0.45));
      fg.addColorStop(1, rgba(C.indigoDeep, 0.68));
      ctx.fillStyle = fg;
      ctx.fillRect(0, H * 0.70, W, H * 0.30);
    }

    /* ending subject — peak frame: motifs present, scene brightened */
    function drawEnding(tt) {
      var s = V.subjectEnding || "court";
      if (s === "court") drawCourt(tt);
      else if (s === "gate") drawGate(tt);
      else if (s === "bridge" || s === "descent") drawDescent(tt);
      else drawTerrace(tt);
      /* full-bridge memory: every segment gone, only shimmer left */
      if (s === "bridge" || s === "descent") {
        var keep = V.progress; V.progress = 1; drawBridge(tt); V.progress = keep;
      }
    }

    function renderL2(tt) {
      var s = V.subject;
      if (s === "bridge") drawBridge(tt);
      else if (s === "gate") drawGate(tt);
      else if (s === "court") drawCourt(tt);
      else if (s === "terrace") drawTerrace(tt);
      else if (s === "descent") drawDescent(tt);
      else if (s === "second") drawSecond(tt);
      else if (s === "ending") drawEnding(tt);
      else drawBridge(tt);
    }

    /* ======================= L3 — particles =======================
       桂花金粉 (缃绮) / 极寒霜气 / 曲调音纹. Frost density is the
       warmth signal — the scene is never globally darkened instead.
       ================================================================ */
    function renderL3(tt) {
      var cool = (YGEngine.limits.warmth - V.warmth) / YGEngine.limits.warmth;
      var frostCol = mixc(C.moonWhite, C.mineralBlue, 0.18 + cool * 0.42);
      var goldCol = mixc(C.osmanthus, C.silver, cool * 0.34);

      /* 曲调音纹 — expanding rings, count driven by 记曲 */
      var rn = ringCount();
      if (rn > 0) {
        var rcx = W * 0.47, rcy = H * 0.52;
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        for (var q = 0; q < rn; q++) {
          var rp = rings[q % rings.length];
          var p = ((tt * 0.16 * rp.spd + rp.ph) % 1);
          var rad = H * (0.04 + p * 0.44);
          ctx.strokeStyle = rgba(C.moonWhite, (1 - p) * 0.30);
          ctx.lineWidth = rp.w;
          ctx.beginPath(); ctx.arc(rcx, rcy, rad, 0, TAU); ctx.stroke();
        }
        ctx.restore();
      }

      /* 桂花金粉 */
      var gn = goldCount();
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      for (var i = 0; i < gn && i < gold.length; i++) {
        var gp = gold[i];
        var gy = (((gp.y - tt * 0.016 * gp.spd) % 1) + 1) % 1;
        var gx = (gp.x + Math.sin(tt * 0.30 * gp.drift + gp.ph) * 0.028) * W;
        var yy = gy * H;
        var al = gp.a * (0.55 + 0.45 * Math.sin(tt * 0.85 + gp.ph)) * (0.8 + V.lift * 0.4);
        if (al <= 0.01) continue;
        var gr = gp.r * (1 + V.lift * 0.3);
        var gg = ctx.createRadialGradient(gx, yy, 0, gx, yy, gr * 4);
        gg.addColorStop(0, rgba(goldCol, al));
        gg.addColorStop(0.4, rgba(goldCol, al * 0.35));
        gg.addColorStop(1, rgba(goldCol, 0));
        ctx.fillStyle = gg;
        ctx.beginPath(); ctx.arc(gx, yy, gr * 4, 0, TAU); ctx.fill();
      }
      ctx.restore();

      /* 极寒霜气 — density rises as warmth falls */
      var fn = frostCount();
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      for (var j = 0; j < fn && j < frost.length; j++) {
        var fp = frost[j];
        var fy = (((fp.y + tt * 0.021 * fp.spd) % 1) + 1) % 1;
        var fx = (fp.x + Math.sin(tt * 0.22 * fp.drift + fp.ph) * 0.035) * W;
        var yy2 = fy * H;
        var al2 = fp.a * (0.6 + 0.4 * Math.sin(tt * 0.6 + fp.ph));
        if (al2 <= 0.01) continue;
        var fr = fp.r * (1 + V.lift * 0.25);
        ctx.fillStyle = rgba(frostCol, al2 * 0.85);
        ctx.beginPath(); ctx.arc(fx, yy2, fr, 0, TAU); ctx.fill();
        if (fp.spoke) {
          ctx.strokeStyle = rgba(frostCol, al2 * 0.5);
          ctx.lineWidth = 0.8;
          var sl = fr * 3.4;
          for (var sp = 0; sp < 4; sp++) {
            var ang = sp * Math.PI / 4 + fp.ph;
            ctx.beginPath();
            ctx.moveTo(fx - Math.cos(ang) * sl, yy2 - Math.sin(ang) * sl);
            ctx.lineTo(fx + Math.cos(ang) * sl, yy2 + Math.sin(ang) * sl);
            ctx.stroke();
          }
        }
      }
      ctx.restore();
    }

    /* ===================== vignette (spatial depth) =====================
       §11.4 dynamic-range extension. The night palette bottoms out at
       青黛 #1A3A5F (luminance 53.9), so nothing ever lands in the 0-54 band
       and the used luminance span stalls near 190 levels. This peripheral
       darkening fills that band.
       - Deterministic by construction: no RNG, pure geometry (§7).
       - Hue-neutral: a neutral grey multiply only SCALES the indigo, it never
         shifts it, so §6.1 palette compliance is preserved.
       - Luminance-neutral in the scene centre (factor exactly 1 there).
       - Floor is deliberately non-zero (VIG_EDGE), so pure-black pixels stay
         at 0 and the "< 1% pure black" guard holds.
       - This is a DEPTH cue, not a warmth expression, so §10 is not implicated.
       Applied before drawSeal so the 朱砂 seal keeps full cinnabar strength. */
    function renderVignette() {
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      var cx = cv.width * 0.50, cy = cv.height * 0.45;
      var rOuter = Math.sqrt(cv.width * cv.width + cv.height * cv.height) * 0.52;
      var g = ctx.createRadialGradient(cx, cy, rOuter * 0.30, cx, cy, rOuter);
      var mid = "rgb(" + VIG_MID + "," + VIG_MID + "," + VIG_MID + ")";
      var edge = "rgb(" + VIG_EDGE + "," + VIG_EDGE + "," + VIG_EDGE + ")";
      g.addColorStop(0, "rgb(255,255,255)");
      g.addColorStop(0.50, "rgb(255,255,255)");
      g.addColorStop(0.76, mid);
      g.addColorStop(1, edge);
      ctx.globalCompositeOperation = "multiply";
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.restore();
    }

    /* ===================== 朱砂印章 (always visible) ===================== */
    function drawSeal(label) {
      var s = Math.min(W, H) * 0.132;
      var cx = W - s * 0.72, cy = H - s * 0.72;

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(-5 * Math.PI / 180);

      /* cinnabar plate — the only 朱红 surface in the whole frame */
      rr(ctx, -s / 2, -s / 2, s, s, s * 0.10);
      ctx.fillStyle = "#ED5126";
      ctx.fill();
      /* inner frame */
      ctx.strokeStyle = rgba(C.moonWhite, 0.94);
      ctx.lineWidth = Math.max(1.2, s * 0.045);
      rr(ctx, -s * 0.40, -s * 0.40, s * 0.80, s * 0.80, s * 0.05);
      ctx.stroke();

      /* seal text — vertical, ending name on ending frames */
      ctx.fillStyle = rgba(C.moonWhite, 0.98);
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      var chars = String(label || "").slice(0, 4).split("");
      var fs = chars.length <= 2 ? s * 0.34 : (chars.length === 3 ? s * 0.27 : s * 0.235);
      ctx.font = "600 " + fs.toFixed(1) + "px " + '"Songti SC","STSong","SimSun",serif';
      var n = chars.length;
      var startY = -(n - 1) * fs * 0.62;
      for (var i = 0; i < n; i++) ctx.fillText(chars[i], 0, startY + i * fs * 1.24);

      ctx.restore();
      ctx.textBaseline = "alphabetic";
    }

    /* ========================= frame composite ========================= */
    function syncFromEngine() {
      var st = YGEngine.state();
      V.warmth = st.warmth; V.tune = st.tune; V.dance = st.dance;
      V.progress = YGEngine.progress();
      if (YGEngine.isEnding(st.nodeId)) {
        /* peak frame keeps the last walked motif, so the ending is a summit not a blackout */
        V.subjectEnding = V.lastWalkedSubject || "court";
        V.subject = "ending";
        V.target = 1;
      } else {
        V.subject = subjectFor(st.nodeId);
        V.lastWalkedSubject = V.subject;
        V.target = 0;
      }
    }

    function draw(nowMs) {
      if (!ctx) return;
      var tt = (clockOverride !== null ? clockOverride : nowMs) / 1000;
      /* §7 — a frozen clock must yield a byte-identical frame, so the lift
         easing snaps instead of creeping while the clock is held */
      if (clockOverride !== null) V.lift = V.target;
      else V.lift += (V.target - V.lift) * Math.min(1, (1 / 60) * 2.4);

      syncFromEngine();

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, W, H);

      renderL1(tt);           /* L1 background */
      renderMoon(tt);
      renderL2(tt);           /* L2 scene subject */
      renderBloom();
      renderL3(tt);           /* L3 particles */
      renderVignette();       /* peripheral depth darkening (§11.4 range) */

      /* full-resolution grain pass — device pixels, symmetric modulation.
         `overlay` alone is multiplicative, so it re-quantises the very bands it
         is meant to break; the second source-over pass adds an unbiased ±spread
         on top of every base value, which is what actually fills the gaps.
         The 月轮 disc is punched out with an evenodd path: §6.2 requires the
         moon to stay CRISP at full resolution, and grain over it would both
         muddy the disc and cap its peak below true white. */
      if (grainPattern) {
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.beginPath();
        ctx.rect(0, 0, cv.width, cv.height);
        ctx.arc(cv.width * MU, cv.height * MV, cv.height * MR * 1.04, 0, TAU);
        ctx.globalCompositeOperation = "overlay";
        ctx.globalAlpha = 0.72;
        ctx.fillStyle = grainPattern;
        ctx.fill("evenodd");
        ctx.globalCompositeOperation = "source-over";
        ctx.globalAlpha = 0.16;
        ctx.fillStyle = grainFillPattern;
        ctx.fill("evenodd");
        ctx.restore();
      }

      /* seal sits above every layer and is always visible (§10) */
      var ending = YGEngine.currentEnding();
      drawSeal(ending && ending.name ? ending.name : "月宫一夜");
    }

    function setClock(ms) { clockOverride = (typeof ms === "number") ? ms : null; }

    return {
      init: init, resize: resize, draw: draw, setClock: setClock,
      particles: particleStats,
      subject: function () { return V.subject; },
      lift: function () { return V.lift; }
    };
  })();

  /* ========================== [SHARE] =============================
     §8 — Canvas 2D 900x1200 PNG share card, guiyue's approach.
     Degrades instead of throwing when the canvas is tainted (hedeng).
     ================================================================ */
  var YGShare = (function () {
    var CW = 900, CH = 1200;
    var KAITI = '"Songti SC","STSong","KaiTi","SimSun",serif';
    var MOON_WHITE = "#EEF7F2", SILVER = "#F1F0ED", INDIGO = "#2A475F";
    var INDIGO_DEEP = "#1A3A5F", MINERAL = "#2E5D8C", OSMANTHUS = "#F8C471";
    var CINNABAR = "#ED5126";
    var tainted = false;

    function wrap(text, per, max) {
      var lines = [], line = "";
      var s = String(text || "");
      for (var i = 0; i < s.length; i++) {
        line += s.charAt(i);
        if (line.length >= per) { lines.push(line); line = ""; }
      }
      if (line) lines.push(line);
      return lines.length > max ? lines.slice(0, max) : lines;
    }

    function rrect(g, x, y, w, h, r) {
      var k = Math.min(r, w / 2, h / 2);
      g.beginPath();
      g.moveTo(x + k, y);
      g.lineTo(x + w - k, y); g.quadraticCurveTo(x + w, y, x + w, y + k);
      g.lineTo(x + w, y + h - k); g.quadraticCurveTo(x + w, y + h, x + w - k, y + h);
      g.lineTo(x + k, y + h); g.quadraticCurveTo(x, y + h, x, y + h - k);
      g.lineTo(x, y + k); g.quadraticCurveTo(x, y, x + k, y);
      g.closePath();
    }

    function paintCard(st) {
      st = st || {};
      var c = document.createElement("canvas");
      c.width = CW; c.height = CH;
      var g = c.getContext("2d");
      if (!g) return null;

      /* dithered night ground — same anti-banding discipline as the stage */
      var bg = g.createLinearGradient(0, 0, 0, CH);
      bg.addColorStop(0, INDIGO);
      bg.addColorStop(0.52, INDIGO_DEEP);
      bg.addColorStop(1, INDIGO);
      g.fillStyle = bg;
      g.fillRect(0, 0, CW, CH);

      var rng = rngFrom(0xCA2D17);
      for (var i = 0; i < 2600; i++) {
        var px = rng() * CW, py = rng() * CH;
        var a = 0.012 + rng() * 0.05;
        g.fillStyle = "rgba(238,247,242," + a.toFixed(3) + ")";
        g.fillRect(px, py, 1 + rng() * 1.6, 1 + rng() * 1.6);
      }

      /* moon + halo */
      var mx = 690, my = 168, mr = 52;
      var halo = g.createRadialGradient(mx, my, mr * 0.5, mx, my, mr * 4.4);
      halo.addColorStop(0, "rgba(238,247,242,0.30)");
      halo.addColorStop(0.4, "rgba(238,247,242,0.10)");
      halo.addColorStop(1, "rgba(238,247,242,0)");
      g.fillStyle = halo;
      g.beginPath(); g.arc(mx, my, mr * 4.4, 0, Math.PI * 2); g.fill();
      var body = g.createRadialGradient(mx - mr * 0.3, my - mr * 0.28, mr * 0.1, mx, my, mr);
      body.addColorStop(0, "#FFFFFF");
      body.addColorStop(0.7, MOON_WHITE);
      body.addColorStop(1, MINERAL);
      g.fillStyle = body;
      g.beginPath(); g.arc(mx, my, mr, 0, Math.PI * 2); g.fill();
      g.strokeStyle = "rgba(238,247,242,0.9)";
      g.lineWidth = 2.5;
      g.beginPath(); g.arc(mx, my, mr * 0.98, 0, Math.PI * 2); g.stroke();

      /* silver bridge arcs — volumetric-ish bands */
      g.save();
      g.globalCompositeOperation = "lighter";
      for (var b = 0; b < 7; b++) {
        var by = 620 + b * 34;
        var lg = g.createLinearGradient(0, by - 22, 0, by + 22);
        lg.addColorStop(0, "rgba(238,247,242,0)");
        lg.addColorStop(0.5, "rgba(238,247,242," + (0.055 - b * 0.005).toFixed(3) + ")");
        lg.addColorStop(1, "rgba(238,247,242,0)");
        g.fillStyle = lg;
        g.fillRect(0, by - 22, CW, 44);
      }
      g.restore();
      g.strokeStyle = "rgba(241,240,237,0.34)";
      g.lineWidth = 3;
      for (var s2 = 0; s2 < 5; s2++) {
        g.beginPath();
        g.moveTo(40, 700 + s2 * 40);
        g.bezierCurveTo(300, 686 + s2 * 40, 600, 714 + s2 * 40, 860, 698 + s2 * 40);
        g.stroke();
      }

      /* header */
      g.textAlign = "center";
      g.fillStyle = OSMANTHUS;
      g.font = "46px " + KAITI;
      g.fillText("月宫一夜", 450, 128);
      g.font = "26px " + KAITI;
      g.fillStyle = "rgba(238,247,242,0.60)";
      g.fillText("唐明皇游月宫 · 唐人传奇", 450, 176);

      /* ending name — cinnabar accent */
      g.font = "76px " + KAITI;
      g.fillStyle = CINNABAR;
      g.fillText(st.endingName || "", 450, 400);

      /* stats line */
      g.font = "28px " + KAITI;
      g.fillStyle = "rgba(238,247,242,0.78)";
      g.fillText(
        "记曲 " + (st.tune || 0) + " / 2 · 暖意余 " + (st.warmth || 0) + " 度 · 走过 " + (st.walked || 0) + " 段",
        450, 470
      );

      /* harvest bars */
      var barY = 520;
      g.font = "24px " + KAITI;
      g.textAlign = "left";
      g.fillStyle = "rgba(238,247,242,0.55)";
      g.fillText("记曲", 150, barY + 8);
      g.fillText("观舞", 520, barY + 8);
      for (var d1 = 0; d1 < 2; d1++) {
        g.fillStyle = d1 < (st.tune || 0) ? MOON_WHITE : "rgba(238,247,242,0.16)";
        g.beginPath(); g.arc(248 + d1 * 34, barY, 11, 0, Math.PI * 2); g.fill();
        g.fillStyle = d1 < (st.dance || 0) ? SILVER : "rgba(238,247,242,0.16)";
        g.beginPath(); g.arc(618 + d1 * 34, barY, 11, 0, Math.PI * 2); g.fill();
      }
      /* warmth — the single warm anchor */
      g.textAlign = "center";
      g.fillStyle = "rgba(238,247,242,0.55)";
      g.font = "24px " + KAITI;
      g.fillText("暖意", 450, barY + 78);
      for (var d2 = 0; d2 < 3; d2++) {
        var on = d2 < (st.warmth || 0);
        g.fillStyle = on ? OSMANTHUS : "rgba(238,247,242,0.16)";
        g.beginPath(); g.arc(396 + d2 * 54, barY + 118, 13, 0, Math.PI * 2); g.fill();
        if (on) {
          var wg = g.createRadialGradient(396 + d2 * 54, barY + 118, 2, 396 + d2 * 54, barY + 118, 44);
          wg.addColorStop(0, "rgba(248,196,113,0.30)");
          wg.addColorStop(1, "rgba(248,196,113,0)");
          g.fillStyle = wg;
          g.beginPath(); g.arc(396 + d2 * 54, barY + 118, 44, 0, Math.PI * 2); g.fill();
        }
      }

      /* ending text excerpt */
      var lines = wrap(st.endingText, 22, 4);
      g.font = "27px " + KAITI;
      g.fillStyle = "rgba(238,247,242,0.72)";
      g.textAlign = "center";
      for (var l = 0; l < lines.length; l++) g.fillText(lines[l], 450, 800 + l * 48);

      /* 「月宫一夜」 seal — cinnabar */
      g.save();
      g.translate(770, 1010);
      g.rotate(-6 * Math.PI / 180);
      rrect(g, -62, -62, 124, 124, 12);
      g.fillStyle = CINNABAR; g.fill();
      g.strokeStyle = "rgba(238,247,242,0.92)";
      g.lineWidth = 3.5;
      rrect(g, -50, -50, 100, 100, 7);
      g.stroke();
      g.fillStyle = MOON_WHITE;
      g.font = "30px " + KAITI;
      g.textAlign = "center";
      g.textBaseline = "middle";
      var sealChars = "月宫一夜".split("");
      for (var sc = 0; sc < 4; sc++) g.fillText(sealChars[sc], 0, -36 + sc * 24);
      g.restore();
      g.textBaseline = "alphabetic";

      g.textAlign = "center";
      g.fillStyle = "rgba(238,247,242,0.42)";
      g.font = "21px " + KAITI;
      g.fillText("三源两说不同 · 备录于此 · 非遗手作坊", 450, 1150);

      try {
        return c.toDataURL("image/png");
      } catch (e) {
        if (!tainted) { tainted = true; return paintCard(st); }
        return null;
      }
    }

    function miniTool() { return window.xhs && window.xhs.miniTool; }
    function fallback() {
      var note = document.getElementById("card-note");
      if (note) note.textContent = "当前环境暂不支持直接保存，请截图保存";
    }

    function withFile(fn) {
      var mt = miniTool();
      var st = YGShare.lastStats;
      if (!mt || !st) { fallback(); return; }
      var url = null;
      try { url = paintCard(st); } catch (e) { url = null; }
      if (!url) { fallback(); return; }
      try {
        mt.writeTempFile({
          data: url,
          success: function (res) { fn(mt, res && res.filePath); },
          fail: fallback
        });
      } catch (e) { fallback(); }
    }

    return {
      lastStats: null,
      paintCard: paintCard,
      saveAlbum: function () {
        withFile(function (mt, p) {
          try {
            mt.saveImageToPhotosAlbum({ filePath: p, success: function () { }, fail: fallback });
          } catch (e) { fallback(); }
        });
      },
      postNote: function () {
        withFile(function (mt, p) {
          try {
            mt.postNote({
              title: "中秋望夜，我随罗公远登了银桥",
              content: "游月宫一夜：五个选择，两种所得。记曲得声调，观舞得神韵——不可兼得。唐人传奇，非史实。",
              tags: "#国风vibecoding #中秋节 #游月宫 #国风 #中式美学 #传统文化",
              mediaInfo: { image_resources: [{ url: p }] },
              fail: fallback
            });
          } catch (e) { fallback(); }
        });
      },
      fallback: fallback
    };
  })();

  /* =========================== [MAIN] =============================
     DOM glue + window.__ready / window.__game test hooks.
     All interaction goes through addEventListener — zero inline handlers.
     ================================================================ */
  var collected = {};
  var uiPhase = "intro";
  var locked = false;

  function $(id) { return document.getElementById(id); }

  function setView(id) {
    var views = document.querySelectorAll(".view");
    for (var i = 0; i < views.length; i++) views[i].classList.toggle("is-active", views[i].id === id);
    var ui = $("ui");
    if (ui) ui.classList.toggle("sheet-light", id === "view-ending");
    uiPhase = id === "view-intro" ? "intro"
      : id === "view-node" ? "node"
        : id === "view-outcome" ? "outcome"
          : id === "view-ending" ? "ending" : "intro";
  }

  function fillDots(el, value, max, cls) {
    if (!el) return;
    el.innerHTML = "";
    for (var i = 0; i < max; i++) {
      var s = document.createElement("span");
      s.className = "dot" + (i < value ? " " + cls : "");
      el.appendChild(s);
    }
  }

  function renderResources(suffix) {
    var r = YGEngine.resources();
    var L = YGEngine.limits;
    fillDots($("dots-warmth" + suffix), r.warmth, L.warmth, "on-warm");
    fillDots($("dots-tune" + suffix), r.tune, L.harvest, "on-cool");
    fillDots($("dots-dance" + suffix), r.dance, L.harvest, "on-silver");
  }

  function deltaLine(choice) {
    var parts = [];
    if (typeof choice.warmth === "number" && choice.warmth !== 0) {
      parts.push("暖意 " + (choice.warmth > 0 ? "+" : "") + choice.warmth);
    }
    if (typeof choice.tune === "number" && choice.tune !== 0) {
      parts.push("记曲 " + (choice.tune > 0 ? "+" : "") + choice.tune);
    }
    if (typeof choice.dance === "number" && choice.dance !== 0) {
      parts.push("观舞 " + (choice.dance > 0 ? "+" : "") + choice.dance);
    }
    return parts.join(" · ");
  }

  function renderIntro() {
    var D = YGEngine.data();
    var meta = (D && D.meta) || {};
    $("intro-title").textContent = meta.title || "";
    $("intro-sub").textContent = meta.subtitle || "";
    $("intro-body").textContent = meta.intro || "";
    setView("view-intro");
  }

  /* Terminal fallback for an id that exists in NEITHER D.nodes nor D.endings
     (a dangling `next`, or data whose ending map was swapped under us).
     This MUST NOT delegate back to renderNode/renderEnding — each of those
     delegates here when its own source is missing, so a mutual delegation
     would recurse until the stack blows. */
  function renderOrphan() {
    var id = YGEngine.state().nodeId;
    $("node-title").textContent = id || "";
    $("node-text").textContent = "";
    $("node-step").textContent = "";
    renderResources("");

    var box = $("choice-list");
    box.innerHTML = "";
    var b = document.createElement("button");
    b.type = "button";
    b.className = "choice";
    b.textContent = "重 新 开 始";
    b.addEventListener("click", start);
    box.appendChild(b);
    setView("view-node");
  }

  function renderNode() {
    var nd = YGEngine.currentNode();
    if (!nd) {
      /* only delegate when the ending actually exists, otherwise terminate */
      if (YGEngine.currentEnding()) { renderEnding(); return; }
      renderOrphan();
      return;
    }
    $("node-title").textContent = nd.title || "";
    $("node-text").textContent = nd.text || "";
    $("node-step").textContent = "第 " + YGEngine.walked() + " 段";
    renderResources("");

    var box = $("choice-list");
    box.innerHTML = "";
    var list = nd.choices || [];
    for (var i = 0; i < list.length; i++) {
      (function (idx) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "choice";
        b.textContent = list[idx].text || "";
        b.style.animationDelay = (idx * 90) + "ms";
        b.addEventListener("click", function () { choose(idx); });
        box.appendChild(b);
      })(i);
    }
    setView("view-node");
  }

  function renderOutcome(res) {
    $("outcome-text").textContent = YGEngine.outcomeText();
    $("outcome-delta").textContent = deltaLine(res.choice);
    renderResources("-o");
    var atEnd = YGEngine.isEnding(YGEngine.state().nodeId);
    $("btn-advance").textContent = atEnd ? "天 将 明" : "继 续";
    setView("view-outcome");
  }

  function renderEnding() {
    var e = YGEngine.currentEnding();
    if (!e) {
      /* only delegate when the node actually exists, otherwise terminate */
      if (YGEngine.currentNode()) { renderNode(); return; }
      renderOrphan();
      return;
    }
    var id = YGEngine.state().nodeId;
    collected[id] = true;
    var r = YGEngine.resources();

    $("end-name").textContent = e.name || "";
    $("end-cond").textContent = e.cond || "";
    $("end-text").textContent = e.text || "";
    $("end-stats").textContent =
      "记曲 " + r.tune + " / 2 · 观舞 " + r.dance + " / 2 · 暖意余 " + r.warmth + " 度 · 走过 " + YGEngine.walked() + " 段";

    /* knowledge — deterministic pick, no ambient randomness */
    var D = YGEngine.data();
    var know = (D && D.knowledge) || [];
    var kbox = $("end-know");
    if (know.length) {
      var idx = Object.keys(collected).length % know.length;
      var k = know[idx] || know[0];
      $("end-know-t").textContent = k.title || "";
      $("end-know-x").textContent = k.text || "";
      kbox.style.display = "";
    } else {
      kbox.style.display = "none";
    }

    /* collected endings */
    var list = $("endings-list");
    list.innerHTML = "";
    var ids = (D && D.endings) ? Object.keys(D.endings) : [];
    for (var i = 0; i < ids.length; i++) {
      var chip = document.createElement("span");
      var got = !!collected[ids[i]];
      chip.className = "ending-chip" + (got ? " got" : "");
      chip.textContent = got ? (D.endings[ids[i]].name || "") : "？？？";
      list.appendChild(chip);
    }

    /* share card */
    YGShare.lastStats = {
      endingName: e.name || "", endingText: e.text || "",
      tune: r.tune, dance: r.dance, warmth: r.warmth, walked: YGEngine.walked()
    };
    var wrapBox = $("card-wrap");
    wrapBox.innerHTML = "";
    var url = null;
    try { url = YGShare.paintCard(YGShare.lastStats); } catch (err) { url = null; }
    if (url) {
      var img = document.createElement("img");
      img.alt = "分享卡";
      img.src = url;
      wrapBox.appendChild(img);
      $("card-note").textContent = "长按或点「存图」保存这一夜";
    } else {
      $("card-note").textContent = "当前环境暂不支持生成分享卡，请截图保存";
    }

    setView("view-ending");
  }

  function render() {
    if (YGEngine.isEnding(YGEngine.state().nodeId)) renderEnding();
    else if (uiPhase === "outcome") { /* outcome stays until advanced */ }
    else if (uiPhase === "intro") renderIntro();
    else renderNode();
  }

  function choose(i) {
    if (locked || !YGEngine.data()) return;
    if (YGEngine.isEnding(YGEngine.state().nodeId)) return;
    locked = true;
    var res = YGEngine.choose(i);
    if (!res) { locked = false; return; }
    renderOutcome(res);
    window.setTimeout(function () { locked = false; }, 320);
  }

  function advance() {
    if (locked) return;
    locked = true;
    if (YGEngine.isEnding(YGEngine.state().nodeId)) renderEnding();
    else renderNode();
    window.setTimeout(function () { locked = false; }, 320);
  }

  function start() {
    YGEngine.reset();
    collected = {};
    renderResources("");
    renderNode();
  }

  function goHome() { renderIntro(); }

  /* ----------------------------- boot ----------------------------- */
  function resolveData() {
    if (typeof D !== "undefined" && D) return D;
    if (window.YGData) return window.YGData;
    return null;
  }

  function boot() {
    var cv = $("stage");
    YGScene.init(cv);

    var data = resolveData();
    YGEngine.init(data);

    $("btn-start").addEventListener("click", start);
    $("btn-advance").addEventListener("click", advance);
    $("btn-restart").addEventListener("click", start);
    $("btn-home").addEventListener("click", goHome);
    $("btn-save").addEventListener("click", function () { YGShare.saveAlbum(); });
    $("btn-note").addEventListener("click", function () { YGShare.postNote(); });
    window.addEventListener("resize", function () { YGScene.resize(); });

    if (data) renderIntro(); else setView("view-intro");

    var t0 = (typeof performance !== "undefined" && performance.now) ? performance.now() : Date.now();
    function frame() {
      var elapsed = ((typeof performance !== "undefined" && performance.now) ? performance.now() : Date.now()) - t0;
      YGScene.draw(elapsed);
      window.requestAnimationFrame(frame);
    }
    YGScene.draw(0);
    window.requestAnimationFrame(frame);

    /* ---- test / integration hooks ---- */
    window.__game = {
      state: function () { return YGEngine.state(); },
      resources: function () { return YGEngine.resources(); },
      goto: function (nodeId) {
        YGEngine.goto(nodeId);
        render();
        return YGEngine.state();
      },
      choose: function (i) {
        var res = YGEngine.choose(i);
        if (res) renderOutcome(res);
        return YGEngine.state();
      },
      reset: function () {
        YGEngine.reset();
        collected = {};
        renderIntro();
        return YGEngine.state();
      },
      advance: advance,
      start: start,
      /* §11.4 objective metrics: frost proportion vs warmth */
      particles: function () { return YGScene.particles(); },
      /* §7 reproducibility: freeze the clock for identical frames */
      setClock: function (ms) { YGScene.setClock(ms); },
      /* §8 share card */
      paintCard: function (st) { return YGShare.paintCard(st || YGShare.lastStats); },
      /* integration: swap in data produced by the prose module */
      loadData: function (obj) {
        YGEngine.init(obj || null);
        collected = {};
        renderIntro();
        return YGEngine.state();
      },
      subject: function () { return YGScene.subject(); },
      lift: function () { return YGScene.lift(); },
      seed: function () { return SEED; },
      walked: function () { return YGEngine.walked(); }
    };

    window.__ready = true;
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
</body>
</html>
