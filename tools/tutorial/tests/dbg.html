<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>dbg</title>
<link rel="stylesheet" href="../assets/theme.css"><link rel="stylesheet" href="../assets/ui.css"></head>
<body>
<div id="app">
  <header class="top"><div class="top-row"><p class="kicker" id="kicker"></p><span class="top-meta" id="meta"></span></div>
  <h1 class="top-title" id="title"></h1><div class="stepbar" id="stepbar"></div></header>
  <main class="stage" id="stage"></main>
  <footer class="nav"><button class="nav-back" id="back" type="button"></button><div class="nav-spacer"></div>
  <span class="nav-count" id="count"></span><button class="btn" id="next" type="button"></button></footer>
</div>
<script src="../data/lesson-cdrive.js"></script>
<script src="../assets/engine.js"></script>
<script>
setTimeout(function () {
  try { localStorage.removeItem('djl:' + LESSON.id); } catch (e) {}
  var el = document.querySelector('[data-rid="c"]');
  var before = document.getElementById('next').disabled;
  if (el) el.click();
  setTimeout(function () {
    var n = document.getElementById('next');
    var sy = document.querySelector('.sim-say');
    document.title = 'row=' + (el ? 'yes' : 'no') + ' before=' + before +
      ' after=' + n.disabled + ' say=' + (sy ? sy.className + ':' + sy.textContent.slice(0, 24) : 'none');
  }, 120);
}, 200);
</script>
</body></html>
