<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>后羿射日 · 物理内核原型</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #0B1524; }
  body {
    font-family: "Kaiti SC","STKaiti","KaiTi","Songti SC",serif;
    color: #E8DCC0; -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none; touch-action: none;
  }
  #stage { position: fixed; inset: 0; display: block; cursor: crosshair; }

  /* ---------- HUD ---------- */
  #hud {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; align-items: center; gap: 14px;
    padding: 10px 14px; pointer-events: none; z-index: 5;
  }
  .chip {
    pointer-events: auto;
    background: rgba(12,22,38,.72); border: 1px solid rgba(230,180,34,.34);
    border-radius: 999px; padding: 5px 13px;
    font-size: 14px; letter-spacing: .04em; white-space: nowrap;
    backdrop-filter: blur(6px);
  }
  .chip b { color: #F0C24A; font-weight: 700; }
  .chip.warn { border-color: rgba(255,79,216,.5); }
  #title {
    font-size: 17px; font-weight: 700; color: #F0C24A;
    letter-spacing: .16em; text-shadow: 0 0 14px rgba(240,194,74,.35);
  }
  #sub { font-size: 11.5px; color: #8FA3BC; letter-spacing: .05em; }

  /* ---------- buttons ---------- */
  #bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
    gap: 8px; padding: 9px 12px;
    background: linear-gradient(to top, rgba(8,14,26,.86), rgba(8,14,26,0));
  }
  button {
    font-family: inherit; font-size: 13px; letter-spacing: .06em;
    color: #E8DCC0; background: rgba(20,34,54,.88);
    border: 1px solid rgba(230,180,34,.30); border-radius: 8px;
    padding: 7px 14px; cursor: pointer; transition: background .16s, border-color .16s, transform .1s;
  }
  button:hover { background: rgba(34,54,82,.95); border-color: rgba(240,194,74,.7); }
  button:active { transform: translateY(1px); }
  button.on { background: rgba(240,194,74,.18); border-color: #F0C24A; color: #F8E7B0; }
  button.danger { border-color: rgba(195,39,43,.55); }

  /* ---------- verdict / banner ---------- */
  #verdict {
    position: fixed; left: 50%; top: 56px; transform: translateX(-50%);
    z-index: 7; max-width: min(680px, 92vw);
    padding: 9px 16px; border-radius: 10px; text-align: center;
    font-size: 14.5px; line-height: 1.55; letter-spacing: .03em;
    background: rgba(10,18,32,.90); border: 1px solid rgba(230,180,34,.30);
    backdrop-filter: blur(8px); opacity: 0; transition: opacity .25s; pointer-events: none;
  }
  #verdict.show { opacity: 1; }
  #verdict.ok  { border-color: rgba(96,220,150,.65); color: #C6F5DA; }
  #verdict.bad { border-color: rgba(255,90,90,.7);  color: #FFD3D3; }
  #verdict.info{ border-color: rgba(240,194,74,.5); color: #F6E6BE; }

  #banner {
    position: fixed; inset: 0; z-index: 8; display: none;
    align-items: center; justify-content: center; flex-direction: column; gap: 14px;
    background: rgba(8,14,26,.74); backdrop-filter: blur(4px);
  }
  #banner.show { display: flex; }
  #banner h1 { font-size: 46px; letter-spacing: .3em; color: #F0C24A; text-shadow: 0 0 30px rgba(240,194,74,.4); }
  #banner p  { font-size: 16px; color: #A9BCD4; letter-spacing: .08em; }

  #legend {
    position: fixed; right: 12px; top: 54px; z-index: 5; display: none;
    background: rgba(10,18,32,.86); border: 1px solid rgba(79,209,224,.34);
    border-radius: 10px; padding: 9px 12px; font-size: 11.5px; line-height: 1.8;
    color: #B9CCDF; backdrop-filter: blur(6px); pointer-events: none;
  }
  #legend.show { display: block; }
  #legend i { display: inline-block; width: 11px; height: 11px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  @media (max-width: 640px) {
    #hud { gap: 8px; padding: 8px 10px; }
    .chip { font-size: 12px; padding: 4px 10px; }
    #title { font-size: 14px; } #sub { display: none; }
    button { font-size: 12px; padding: 6px 11px; }
    #legend { display: none !important; }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div id="hud">
  <div>
    <div id="title">后羿射日</div>
    <div id="sub">物理内核原型 · 轮廓碰撞体</div>
  </div>
  <div class="chip">彤弓素缯 <b id="arrows">–</b></div>
  <div class="chip">金乌 <b id="birds">–</b></div>
  <div class="chip" id="mode-chip">射日关</div>
  <div class="chip warn" id="fps">–</div>
</div>

<div id="legend">
  <div><i style="background:#4FD1E0"></i>青线 = 真实碰撞多边形（凸块并集）</div>
  <div><i style="background:#FF4FD8"></i>紫虚框 = 矩形包围盒（<b>不用</b>作碰撞）</div>
  <div><i style="background:rgba(255,79,216,.45)"></i>紫雾 = 「幽灵碰撞区」：矩形会误判、轮廓不会</div>
</div>

<div id="verdict"></div>
<div id="banner"><h1 id="bn-title"></h1><p id="bn-sub"></p></div>

<div id="bar">
  <button id="btn-reset" class="danger">重置</button>
  <button id="btn-debug">显示碰撞体</button>
  <button id="btn-level" class="on">射日关</button>
  <button id="btn-range">碰撞精度靶场</button>
  <button id="btn-ghost" style="display:none">射空白角（应 MISS）</button>
  <button id="btn-body"  style="display:none">射鸟身（应 HIT）</button>
  <button id="btn-auto"  style="display:none">自动双测</button>
</div>

<script>
(function () {
  'use strict';

  /* ==========================================================================
     0. 配置
     ========================================================================== */
  var M = window.Matter;
  var WORLD_W = 1280, WORLD_H = 720;
  var GROUND_Y = 690;
  var STEP = 1000 / 60;                 // 固定步长（轨迹预览确定性）
  var ANCHOR = { x: 152, y: 538 };      // 彤弓锚点
  var MAX_PULL = 140;                   // 最大拉距 px
  var POWER_SCALE = 0.122;              // 拉距 -> 速度
  var MAX_SPEED = 17.2;                 // 箭速封顶（防穿透，Matter 无 CCD）
  var DAMAGE_SCALE = 6;                 // 伤害 = 相对速度 * 系数
  var MIN_IMPACT = 2.0;                 // 低于此冲击不结算（静置接触）
  var ARROWS_PER_LEVEL = 5;
  var BIRD_SCALE = 1.7;

  var HP = { fusan: 45, rilun: 130, jinwu: 14 };   // 扶桑低 / 日轮高 / 金乌一击

  var C = {
    skyTop: '#0B1524', skyMid: '#16293F', skyGlow: '#4A2A26', horizon: '#7A3A22',
    ground: '#241A13', groundTop: '#4A3524',
    jinwuBody: '#E0512B', jinwuWing: '#F0A034', jinwuHead: '#F5C542',
    jinwuBeak: '#FFDE7A', jinwuLeg: '#B93A22', jinwuEye: '#170D08', jinwuFlame: '#FF7A3C',
    rilunRing: '#F5C542', rilunCore: '#E08A18', rilunRay: '#FFF0BC',
    bark: '#6B4A2F', barkDark: '#4E3520', moss: '#4E6B3A', knot: '#8A6238',
    arrowShaft: '#F2F0EA', arrowHead: '#C9CDD4', arrowFletch: '#DCD6C6',
    bow: '#C3272B', bowDark: '#8E1C20', string: '#F4E7C6',
    traj: '#FFD86B',
    dbgPoly: '#4FD1E0', dbgBox: '#FF4FD8', dbgGhost: 'rgba(255,79,216,0.30)'
  };

  /* ==========================================================================
     1. Matter 引擎（headless，不用 Matter.Render）
     ========================================================================== */
  var engine = M.Engine.create({ enableSleeping: true });
  var world = engine.world;
  engine.gravity.x = 0;
  engine.gravity.y = 1;
  engine.gravity.scale = 0.001;

  var GRAV_SCALE = (engine.gravity.scale !== undefined) ? engine.gravity.scale : 0.001;
  var GRAV_STEP_X = engine.gravity.x * GRAV_SCALE * STEP * STEP;
  var GRAV_STEP_Y = engine.gravity.y * GRAV_SCALE * STEP * STEP;

  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d');
  var ghostCanvas = document.createElement('canvas');
  var ghostCtx = ghostCanvas.getContext('2d');

  var dpr = 1, scale = 1, offX = 0, offY = 0;
  var stars = [];

        Matter.js 0.19 未内建 poly-decomp -> 凹多边形会被静默 hull 成包围多边形，
        正是「幽灵碰撞区」的成因。因此凹轮廓一律手工拆成凸块 + Body.create({parts})。
     ========================================================================== */
  var SHAPES = {
    // ---- 金乌（三足乌）朝左：鸟身 + 颈 + 头 + 喙 + 尾 + 翼 + 三足 ----
    jinwu: {
      body: [[-18, -10], [-10, -14], [8, -14], [17, -8], [18, 3], [13, 13], [0, 16], [-13, 13], [-18, 4]],
      neck: [[-14, -9], [-4, -14], [-20, -27], [-28, -19]],
      head: [[-33, -33], [-23, -35], [-19, -27], [-23, -20], [-31, -22]],
      beak: [[-41, -28], [-33, -31], [-33, -24]],
      tail: [[13, -13], [22, -22], [38, -34], [36, -16], [20, -6]],
      wing: [[-10, -11], [2, -15], [14, -10], [12, 2], [-6, 3]],
      leg1: [[-11, 12], [-5, 12], [-5, 28], [-11, 28]],
      leg2: [[-2, 13], [4, 13], [4, 28], [-2, 28]],
      leg3: [[7, 12], [13, 12], [13, 28], [7, 28]]
    },
    // ---- 扶桑树·立枝（收腰 -> 非矩形；上下端平整 -> 可堆叠）----
    trunkH132: {
      top: [[-13, -66], [13, -66], [13, -26], [-13, -26]],
      mid: [[-7, -26], [9, -26], [11, 26], [-5, 26]],
      bot: [[-13, 26], [13, 26], [13, 66], [-13, 66]]
    },
    trunkH116: {
      top: [[-13, -58], [13, -58], [13, -23], [-13, -23]],
      mid: [[-7, -23], [9, -23], [11, 23], [-5, 23]],
      bot: [[-13, 23], [13, 23], [13, 58], [-13, 58]]
    },
    trunkH98: {
      top: [[-13, -49], [13, -49], [13, -19], [-13, -19]],
      mid: [[-7, -19], [9, -19], [11, 19], [-5, 19]],
      bot: [[-13, 19], [13, 19], [13, 49], [-13, 49]]
    },
    // ---- 扶桑树·横枝（节瘤顶 -> 非矩形；两端平整 -> 可堆叠）----
    beamW290: {
      slab: [[-145, -12], [145, -12], [145, 12], [-145, 12]],
      knotA: [[52, -12], [96, -12], [89, -20], [59, -20]],
      knotB: [[-118, -12], [-78, -12], [-84, -18], [-112, -18]]
    },
    beamW230: {
      slab: [[-115, -11], [115, -11], [115, 11], [-115, 11]],
      knotA: [[38, -11], [80, -11], [74, -18], [44, -18]],
      knotB: [[-96, -11], [-58, -11], [-63, -17], [-90, -17]]
    },
    beamW140: {
      slab: [[-70, -10], [70, -10], [70, 10], [-70, 10]],
      knotA: [[22, -10], [58, -10], [53, -16], [27, -16]],
      knotB: [[-58, -10], [-26, -10], [-31, -15], [-53, -15]]
    },
    // ---- 箭（素缯）：细长，非宽矩形 ----
    arrow: {
      head:   [[27, 0], [18, -4.6], [18, 4.6]],
      shaft:  [[19, -1.7], [-17, -2.3], [-17, 2.3], [19, 1.7]],
      fletch: [[-17, -4.2], [-17, 4.2], [-25, 0]]
    }
  };

  var PART_ROLES = {
    jinwu: ['body', 'neck', 'head', 'beak', 'tail', 'wing', 'leg1', 'leg2', 'leg3']
  };

  var warnings = [];

  function vertsOf(arr) { return arr.map(function (p) { return { x: p[0], y: p[1] }; }); }

  /* Bodies.fromVertices(x,y) 把顶点集的「重心」放到 (x,y)，
     所以必须传入该凸块自身的重心，才能保住我们设计的局部坐标。 */
  function convexPart(arr, opts) {
    var v = vertsOf(arr);
    if (!M.Vertices.isConvex(v)) {
      warnings.push('凹多边形未拆分（会被 hull 成包围多边形）: ' + JSON.stringify(arr));
    }
    var c = M.Vertices.centre(v);
    var b = M.Bodies.fromVertices(c.x, c.y, v, opts);
    if (b.vertices.length !== v.length) {
      warnings.push('凸块被 Matter 改写（顶点数 ' + v.length + ' -> ' + b.vertices.length + '）');
    }
    return b;
  }

  function compoundFrom(shapeName, opts, scaleK) {
    var shape = SHAPES[shapeName];
    var names = Object.keys(shape);
    var parts = names.map(function (n) { return convexPart(shape[n], opts); });
    var body = M.Body.create({ parts: parts });
    if (scaleK && scaleK !== 1) M.Body.scale(body, scaleK, scaleK);
    body.plugin.kind = shapeName.indexOf('jinwu') === 0 ? 'jinwu'
      : shapeName.indexOf('trunk') === 0 || shapeName.indexOf('beam') === 0 ? 'fusan'
      : shapeName.indexOf('arrow') === 0 ? 'arrow' : shapeName;
    body.plugin.roles = PART_ROLES[shapeName] || names;
    body.plugin.shapeName = shapeName;
    return body;
  }

  /* ==========================================================================
     3. 实体工厂
     ========================================================================== */
  function makeJinwu(x, y, opt) {
    opt = opt || {};
    var b = compoundFrom('jinwu', {
      friction: 0.75, frictionStatic: 0.9, restitution: 0.04,
      density: 0.0010, slop: 0.02
    }, BIRD_SCALE);
    b.plugin.hp = HP.jinwu;
    b.plugin.maxHp = HP.jinwu;
    b.plugin.label = '金乌';
    M.Body.setPosition(b, { x: x, y: y });
    M.Body.setAngle(b, 0);
    M.Body.setVelocity(b, { x: 0, y: 0 });
    if (opt.isStatic) M.Body.setStatic(b, true);
    return b;
  }

  function makeFusan(shapeName, x, y) {
    var b = compoundFrom(shapeName, {
      friction: 0.85, frictionStatic: 1.0, restitution: 0.02,
      density: 0.0018, slop: 0.02
    }, 1);
    b.plugin.hp = HP.fusan;
    b.plugin.maxHp = HP.fusan;
    b.plugin.label = '扶桑';
    M.Body.setPosition(b, { x: x, y: y });
    M.Body.setAngle(b, 0);
    return b;
  }

  function makeRilun(x, y, r) {
    var b = M.Bodies.circle(x, y, r, {
      friction: 0.95, frictionStatic: 1.0, restitution: 0.02,
      density: 0.0050, slop: 0.02
    });
    b.plugin.kind = 'rilun';
    b.plugin.hp = HP.rilun;
    b.plugin.maxHp = HP.rilun;
    b.plugin.label = '日轮';
    return b;
  }

  function makeArrow() {
    var b = compoundFrom('arrow', {
      friction: 0.3, restitution: 0.22, density: 0.0050,
      frictionAir: 0, slop: 0.01
    }, 1);
    /* Body.create({parts}) 的父体不继承子块的 frictionAir（默认 0.01），
       这里显式归零 -> 箭做纯抛物线运动，轨迹预览可解析精确复现。 */
    b.frictionAir = 0;
    for (var i = 0; i < b.parts.length; i++) b.parts[i].frictionAir = 0;
    b.plugin.kind = 'arrow';
    b.plugin.hp = Infinity;          // 箭不销毁，只回收
    b.plugin.label = '素缯';
    b.plugin.indestructible = true;
    return b;
  }

  /* 金乌足尖相对 body.position 的偏移（Body.create 会把 position 移到并集重心，
     所以不能直接用设计坐标）。用探针实测，保证栖息时零间隙接触。 */
  var _birdFootOffset = null;
  function birdFootOffset() {
    if (_birdFootOffset !== null) return _birdFootOffset;
    var probe = makeJinwu(0, 0);
    var bb = unionBounds(probe);
    _birdFootOffset = bb.max.y - probe.position.y;
    return _birdFootOffset;
  }

  /* ==========================================================================
     4. 世界边界
     ========================================================================== */
  var statics = [];
  function buildStatics() {
    statics.forEach(function (s) { M.Composite.remove(world, s); });
    statics = [];
    var t = 80;
    var g = M.Bodies.rectangle(WORLD_W / 2, GROUND_Y + t / 2, WORLD_W * 2, t, {
      isStatic: true, friction: 0.95, label: 'ground'
    });
    var lw = M.Bodies.rectangle(-t / 2, WORLD_H / 2, t, WORLD_H * 3, { isStatic: true, friction: 0.4 });
    var rw = M.Bodies.rectangle(WORLD_W + t / 2, WORLD_H / 2, t, WORLD_H * 3, { isStatic: true, friction: 0.4 });
    g.plugin.kind = 'ground'; g.plugin.label = '地面';
    lw.plugin.kind = 'wall'; rw.plugin.kind = 'wall';
    statics = [g, lw, rw];
    M.Composite.add(world, statics);
  }

  /* ==========================================================================
     5. 关卡
     ========================================================================== */
  var mode = 'level';            // 'level' | 'range'
  var birds = [], blocks = [], suns = [];
  var arrow = null, arrowInFlight = false, flightFrames = 0, slowFrames = 0;
  var arrowsLeft = ARROWS_PER_LEVEL;
  var phase = 'ready';           // ready | dragging | flying | won | lost
  var nock = { x: ANCHOR.x, y: ANCHOR.y };
  var dragActive = false;
  var previewPts = [];
  var hitLog = [];
  var particles = [];
  var rings = [];
  var debugOn = false;
  var rangeBird = null;
  var rangeVerdict = null;
  var arrowTrack = [];
  var pendingRetire = 0;
  var frameCount = 0;

  function clearWorld() {
    M.Composite.allBodies(world).slice().forEach(function (b) {
      if (statics.indexOf(b) < 0) M.Composite.remove(world, b);
    });
    birds = []; blocks = []; suns = [];
    arrow = null; arrowInFlight = false; rangeBird = null;
    particles = []; rings = []; hitLog = []; arrowTrack = [];
    pendingRetire = 0;
  }

  function buildLevel() {
    mode = 'level';
    clearWorld();
    buildStatics();

    /* 零间隙精确堆叠（接触面全部平整）：
       trunkH132 hh=66 / trunkH116 hh=58 / trunkH98 hh=49
       beamW290 slab hh=12 / beamW230 slab hh=11 / beamW140 slab hh=10 */
    var FOOT = birdFootOffset();

    // ---- 中央扶桑塔 ----
    addBlock(makeFusan('trunkH132', 760, 624));      // 558..690（立于地面）
    addBlock(makeFusan('trunkH132', 1000, 624));
    addSun(makeRilun(880, 664, 26));                 // 地面日轮，夹在两柱之间
    addBlock(makeFusan('beamW290', 880, 546));       // slab 534..558（压在两柱顶）
    addBlock(makeFusan('trunkH98', 838, 485));       // 436..534（收拢以夹住日轮）
    addBlock(makeFusan('trunkH98', 922, 485));
    addSun(makeRilun(880, 512, 22));                 // 立于 beamW290 slab 顶 534，左右各 7px 余量
    addBlock(makeFusan('beamW230', 880, 425));       // slab 414..436

    // ---- 左栖枝 ----
    addBlock(makeFusan('trunkH116', 600, 632));      // 574..690
    addBlock(makeFusan('beamW140', 600, 564));       // slab 554..574

    // ---- 右栖枝 ----
    addBlock(makeFusan('trunkH116', 1140, 632));
    addBlock(makeFusan('beamW140', 1140, 564));

    // ---- 金乌栖息（足尖 = 枝顶，零间隙）----
    addBird(makeJinwu(880, 414 - FOOT));             // beamW230 slab 顶 414
    addBird(makeJinwu(600, 554 - FOOT));             // beamW140 slab 顶 554
    addBird(makeJinwu(1140, 554 - FOOT));

    arrowsLeft = ARROWS_PER_LEVEL;
    phase = 'ready';
    loadArrow();
    settle(200);
  }

  function buildRange() {
    mode = 'range';
    clearWorld();
    buildStatics();
    // 单只金乌悬空（静态），四周无任何物体 -> 命中判定只能来自金乌自身轮廓
    rangeBird = makeJinwu(900, 392, { isStatic: true });
    addBird(rangeBird);
    arrowsLeft = 99;
    phase = 'ready';
    loadArrow();
    rangeVerdict = null;
  }

  function addBlock(b) { blocks.push(b); M.Composite.add(world, b); }
  function addSun(b) { suns.push(b); M.Composite.add(world, b); }
  function addBird(b) { birds.push(b); M.Composite.add(world, b); }

  function loadArrow() {
    if (phase === 'won' || phase === 'lost') { arrowInFlight = false; return; }
    if (arrow) M.Composite.remove(world, arrow);
    arrow = makeArrow();
    M.Body.setPosition(arrow, { x: ANCHOR.x, y: ANCHOR.y });
    M.Body.setStatic(arrow, true);          // 待发射：静止挂在弓上
    M.Composite.add(world, arrow);
    arrowInFlight = false; flightFrames = 0; slowFrames = 0;
    // 不清 arrowTrack：上一箭的实测轨迹要留给验证比对
    phase = 'ready';
    nock.x = ANCHOR.x; nock.y = ANCHOR.y;
  }

  function settle(n) { for (var i = 0; i < n; i++) M.Engine.update(engine, STEP); }

  /* ==========================================================================
     6. 轨迹预览 —— 解析积分，严格复刻 Matter.Body.update 的递推
        （已在 node 中逐步比对：20 步误差 0）
     ========================================================================== */
  function simulate(sx, sy, vx, vy, maxSteps) {
    var fr = 1 - (arrow ? arrow.frictionAir : 0);
    var x = sx, y = sy, cvx = vx, cvy = vy, pts = [];
    for (var i = 0; i < maxSteps; i++) {
      cvx = cvx * fr + GRAV_STEP_X;
      cvy = cvy * fr + GRAV_STEP_Y;
      x += cvx; y += cvy;
      pts.push({ x: x, y: y, i: i, vx: cvx, vy: cvy });
      if (y > GROUND_Y - 2 || x > WORLD_W + 40 || x < -40) break;
    }
    return pts;
  }

  function launchVector() {
    var dx = ANCHOR.x - nock.x, dy = ANCHOR.y - nock.y;
    var dist = Math.hypot(dx, dy);
    var power = Math.min(dist, MAX_PULL) * POWER_SCALE;
    var angle = Math.atan2(dy, dx);
    return { vx: Math.cos(angle) * power, vy: Math.sin(angle) * power, angle: angle, power: power };
  }

  /* ==========================================================================
     7. 发射（Pattern B：拖动矢量 -> Body.setVelocity）
     ========================================================================== */
  function launch(vx, vy, fromX, fromY) {
    if (!arrow || arrowInFlight) return false;
    if (phase === 'won' || phase === 'lost') return false;
    var fx = (fromX === undefined) ? nock.x : fromX;
    var fy = (fromY === undefined) ? nock.y : fromY;
    M.Body.setStatic(arrow, false);
    M.Body.setPosition(arrow, { x: fx, y: fy });
    M.Body.setAngle(arrow, Math.atan2(vy, vx));
    M.Body.setAngularVelocity(arrow, 0);
    M.Body.setVelocity(arrow, { x: vx, y: vy });
    M.Body.setSpeed(arrow, Math.min(M.Body.getSpeed(arrow), MAX_SPEED));   // 封顶防穿透
    M.Body.set(arrow, 'isSleeping', false);
    M.Sleeping.set(arrow, false);
    arrowInFlight = true; flightFrames = 0; slowFrames = 0;
    arrowsLeft = Math.max(0, arrowsLeft - 1);
    phase = 'flying';
    previewPts = [];
    dragActive = false;
    arrowTrack = [];
    return true;
  }

  function retireArrow() {
    if (!arrow) return;
    spawnPuff(arrow.position.x, arrow.position.y, 6, C.arrowShaft);
    arrowInFlight = false;
    if (mode === 'level' && arrowsLeft <= 0) {
      pendingRetire = 90;            // 让坍塌演完再判负
    } else {
      loadArrow();
    }
  }

  /* ==========================================================================
     8. 碰撞伤害（相对速度，非 penetration.depth）
     ========================================================================== */
  M.Events.on(engine, 'collisionStart', function (ev) {
    for (var i = 0; i < ev.pairs.length; i++) {
      var pair = ev.pairs[i];
      /* 关键：pair.bodyA/bodyB 是「凸块 part」，不是父体。
         part.plugin 是空对象 -> 读不到 hp，伤害永远不结算。
         必须用 collision.parentA/parentB 拿到真正的父体（复合轮廓体的宿主）。 */
      var col = pair.collision;
      var a = (col && col.parentA) || pair.bodyA.parent || pair.bodyA;
      var b = (col && col.parentB) || pair.bodyB.parent || pair.bodyB;
      if (a === b) continue;
      var rel = M.Vector.sub(a.velocity, b.velocity);
      var impact = M.Vector.magnitude(rel);          // 相对速度，非 penetration.depth
      var cp = col && col.supports && col.supports[0];
      var px = cp ? cp.x : (a.position.x + b.position.x) / 2;
      var py = cp ? cp.y : (a.position.y + b.position.y) / 2;
      damage(a, b, impact, px, py);
      damage(b, a, impact, px, py);
      if (impact >= MIN_IMPACT && !isGroundOrWall(a) && !isGroundOrWall(b)) {
        rings.push({ x: px, y: py, t: 0, r: 6 + impact * 1.6 });
      }
    }
  });

  function isGroundOrWall(b) { return b.plugin && (b.plugin.kind === 'ground' || b.plugin.kind === 'wall'); }

  function damage(victim, attacker, impact, px, py) {
    var p = victim.plugin;
    // 地面/墙体没有 hp 字段，自动被第一行挡掉
    if (!p || p.hp === undefined || p.indestructible || p.dead) return;
    if (isGroundOrWall(victim)) return;
    if (impact < MIN_IMPACT) return;                 // 静置接触不结算
    var dmg = impact * DAMAGE_SCALE;
    p.hp -= dmg;
    hitLog.push({
      kind: p.kind, label: p.label, impact: +impact.toFixed(2),
      dmg: +dmg.toFixed(1), hpAfter: +Math.max(0, p.hp).toFixed(1),
      killed: p.hp <= 0, by: attacker.plugin ? attacker.plugin.label : '?',
      at: { x: Math.round(px), y: Math.round(py) }, mode: mode,
      frame: frameCount, arrowFrame: arrowInFlight ? flightFrames : -1
    });
    spawnPuff(px, py, Math.min(10, 3 + impact), p.kind === 'jinwu' ? C.jinwuFlame
      : p.kind === 'rilun' ? C.rilunRing : C.knot);
    if (p.hp <= 0) destroy(victim, px, py);
  }

  function destroy(body, px, py) {
    var p = body.plugin;
    p.dead = true;
    spawnDebris(body);
    M.Composite.remove(world, body);
    var i;
    if ((i = birds.indexOf(body)) >= 0) birds.splice(i, 1);
    if ((i = blocks.indexOf(body)) >= 0) blocks.splice(i, 1);
    if ((i = suns.indexOf(body)) >= 0) suns.splice(i, 1);
    rings.push({ x: px || body.position.x, y: py || body.position.y, t: 0, r: 30, big: true });
    checkEnd();
  }

  /* ==========================================================================
     9. 碎屑粒子
     ========================================================================== */
  function spawnDebris(body) {
    var p = body.plugin, col;
    if (p.kind === 'jinwu') col = [C.jinwuBody, C.jinwuWing, C.jinwuFlame, C.jinwuHead];
    else if (p.kind === 'rilun') col = [C.rilunRing, C.rilunCore, C.rilunRay];
    else if (p.kind === 'arrow') col = [C.arrowShaft];
    else col = [C.bark, C.barkDark, C.moss, C.knot];
    var n = p.kind === 'jinwu' ? 26 : p.kind === 'rilun' ? 18 : 14;
    var bx = body.bounds, cx = body.position.x, cy = body.position.y;
    var sz = Math.max(12, (bx.max.x - bx.min.x) * 0.22);
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2, sp = 1.2 + Math.random() * 4.2;
      particles.push({
        x: cx + (Math.random() - 0.5) * sz, y: cy + (Math.random() - 0.5) * sz,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1.6,
        r: 1.6 + Math.random() * (p.kind === 'jinwu' ? 4.2 : 3.2),
        c: col[(Math.random() * col.length) | 0],
        life: 0, max: 46 + Math.random() * 46,
        rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.28,
        sq: Math.random() < 0.55
      });
    }
    if (p.kind === 'jinwu') {
      // 金乌陨落：坠其羽翼（王逸注「日中九乌皆死，堕其羽翼」）
      for (var j = 0; j < 8; j++) {
        particles.push({
          x: cx + (Math.random() - 0.5) * 40, y: cy,
          vx: (Math.random() - 0.5) * 2.2, vy: -0.4 - Math.random() * 1.2,
          r: 5 + Math.random() * 5, c: C.jinwuWing, life: 0, max: 130,
          rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.06, feather: true
        });
      }
    }
  }

  function spawnPuff(x, y, n, col) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * Math.PI * 2, sp = 0.6 + Math.random() * 2.4;
      particles.push({
        x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 0.8,
        r: 1.2 + Math.random() * 2.2, c: col, life: 0, max: 22 + Math.random() * 20,
        rot: 0, vr: 0, sq: false
      });
    }
  }

  function stepParticles() {
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.life++;
      if (p.life >= p.max) { particles.splice(i, 1); continue; }
      p.vy += p.feather ? 0.035 : 0.16;
      p.vx *= p.feather ? 0.995 : 0.985;
      p.vy *= p.feather ? 0.995 : 0.985;
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      if (p.y > GROUND_Y) { p.y = GROUND_Y; p.vy *= -0.28; p.vx *= 0.7; }
    }
    for (var j = rings.length - 1; j >= 0; j--) {
      rings[j].t++;
      if (rings[j].t > 26) rings.splice(j, 1);
    }
  }

  /* ==========================================================================
     10. 胜负
     ========================================================================== */
  var endTimer = 0;
  function checkEnd() {
    if (phase === 'won' || phase === 'lost') return;
    if (birds.length === 0) {
      phase = 'won';
      showBanner('九日已落', '金乌尽殒 · 扶桑倾颓 · 物理内核验证通过');
    }
  }
  function checkLose() {
    if (phase !== 'flying' && phase !== 'ready') return;
    if (birds.length > 0 && arrowsLeft <= 0 && !arrowInFlight) {
      if (pendingRetire > 0) return;
      endTimer++;
      if (endTimer > 90) {
        phase = 'lost';
        showBanner('素缯已尽', '金乌尚在 · 再试一次');
      }
    } else endTimer = 0;
  }

  /* ==========================================================================
     11. 输入（指针拖动）
     ========================================================================== */
  function toWorld(cx, cy) {
    var r = canvas.getBoundingClientRect();
    return { x: (cx - r.left - offX) / scale, y: (cy - r.top - offY) / scale };
  }

  canvas.addEventListener('pointerdown', function (e) {
    hideVerdict();
    if (mode === 'range') return;                       // 靶场用按钮驱动
    if (phase !== 'ready' || arrowInFlight || !arrow) return;
    var p = toWorld(e.clientX, e.clientY);
    dragActive = true;
    canvas.setPointerCapture(e.pointerId);
    setNock(p);
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!dragActive) return;
    setNock(toWorld(e.clientX, e.clientY));
  });
  function endDrag(e) {
    if (!dragActive) return;
    dragActive = false;
    var v = launchVector();
    if (v.power < 1.2) { nock.x = ANCHOR.x; nock.y = ANCHOR.y; previewPts = []; return; }
    launch(v.vx, v.vy);
  }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  function setNock(p) {
    var dx = p.x - ANCHOR.x, dy = p.y - ANCHOR.y;
    var d = Math.hypot(dx, dy);
    var k = d > MAX_PULL ? MAX_PULL / d : 1;
    nock.x = ANCHOR.x + dx * k;
    nock.y = ANCHOR.y + dy * k;
    var v = launchVector();
    previewPts = v.power < 1.2 ? [] : simulate(nock.x, nock.y, v.vx, v.vy, 110);
    phase = 'dragging';
  }

  /* ==========================================================================
     12. 渲染
     ========================================================================== */
  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
    scale = Math.min(w / WORLD_W, h / WORLD_H);
    offX = (w - WORLD_W * scale) / 2;
    offY = (h - WORLD_H * scale) / 2;
    ghostCanvas.width = WORLD_W; ghostCanvas.height = WORLD_H;
    if (!stars.length) {
      for (var i = 0; i < 90; i++) {
        stars.push({ x: Math.random() * WORLD_W, y: Math.random() * 430, r: Math.random() * 1.5 + 0.3, a: 0.25 + Math.random() * 0.6 });
      }
    }
  }

  function beginWorld() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
    ctx.fillStyle = '#070D18';
    ctx.fillRect(0, 0, canvas.width / dpr, canvas.height / dpr);
    ctx.translate(offX, offY);
    ctx.scale(scale, scale);
  }

  function drawSky() {
    var g = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
    g.addColorStop(0, C.skyTop);
    g.addColorStop(0.52, C.skyMid);
    g.addColorStop(0.82, C.skyGlow);
    g.addColorStop(1, C.horizon);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, WORLD_W, GROUND_Y);

    ctx.save();
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      ctx.globalAlpha = s.a * 0.85;
      ctx.fillStyle = '#DCE8FF';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();
    }
    ctx.restore();

    // 十日并出：天上的余日（装饰，非碰撞）
    var sunPos = [[250, 92], [430, 150], [640, 78], [860, 132], [1080, 96], [1190, 190]];
    for (var k = 0; k < sunPos.length; k++) {
      var sx = sunPos[k][0], sy = sunPos[k][1];
      var rg = ctx.createRadialGradient(sx, sy, 2, sx, sy, 46);
      rg.addColorStop(0, 'rgba(255,214,120,0.85)');
      rg.addColorStop(0.35, 'rgba(240,140,50,0.30)');
      rg.addColorStop(1, 'rgba(240,140,50,0)');
      ctx.fillStyle = rg;
      ctx.beginPath(); ctx.arc(sx, sy, 46, 0, 6.283); ctx.fill();
      ctx.fillStyle = 'rgba(255,226,150,0.72)';
      ctx.beginPath(); ctx.arc(sx, sy, 8, 0, 6.283); ctx.fill();
    }

    // 远山
    ctx.fillStyle = 'rgba(20,14,12,0.55)';
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y);
    var pts = [[0, 600], [120, 540], [260, 588], [390, 512], [520, 574], [660, 528], [800, 586], [940, 536], [1080, 590], [1200, 548], [1280, 596]];
    for (var m = 0; m < pts.length; m++) ctx.lineTo(pts[m][0], pts[m][1]);
    ctx.lineTo(WORLD_W, GROUND_Y); ctx.closePath(); ctx.fill();

    // 地面
    ctx.fillStyle = C.ground;
    ctx.fillRect(0, GROUND_Y, WORLD_W, WORLD_H - GROUND_Y);
    ctx.fillStyle = C.groundTop;
    ctx.fillRect(0, GROUND_Y, WORLD_W, 3);
    ctx.fillStyle = 'rgba(122,58,34,0.22)';
    ctx.fillRect(0, GROUND_Y + 3, WORLD_W, 9);
  }

  function partPath(part) {
    var v = part.vertices;
    ctx.beginPath();
    ctx.moveTo(v[0].x, v[0].y);
    for (var i = 1; i < v.length; i++) ctx.lineTo(v[i].x, v[i].y);
    ctx.closePath();
  }

  /* 占位图形 = 碰撞多边形本体（逐凸块填色 -> 并集即轮廓），
     再叠加纯装饰细节，保证「所见即所撞」。 */
  function drawBody(b) {
    var p = b.plugin;
    if (p.kind === 'rilun') { drawRilun(b); return; }
    if (p.kind === 'jinwu') { drawJinwu(b); return; }
    if (p.kind === 'arrow') { drawArrow(b); return; }
    if (p.kind === 'fusan') { drawFusan(b); return; }
  }

  function drawFusan(b) {
    var parts = b.parts, i;
    var hurt = 1 - Math.max(0, b.plugin.hp) / b.plugin.maxHp;
    ctx.lineJoin = 'round';
    for (i = 1; i < parts.length; i++) {
      partPath(parts[i]);
      ctx.fillStyle = C.bark; ctx.fill();
    }
    // 树皮纹（在轮廓内）
    ctx.save();
    ctx.strokeStyle = 'rgba(78,53,32,0.85)';
    ctx.lineWidth = 1.6;
    var bb = unionBounds(b);
    var horiz = (bb.max.x - bb.min.x) > (bb.max.y - bb.min.y);
    ctx.beginPath();
    if (horiz) {
      var my = b.position.y;
      for (var k = -1; k <= 1; k++) {
        ctx.moveTo(bb.min.x + 4, my + k * 4.5);
        ctx.lineTo(bb.max.x - 4, my + k * 4.5);
      }
    } else {
      var mx = b.position.x;
      for (var j = -1; j <= 1; j++) {
        ctx.moveTo(mx + j * 4.5, bb.min.y + 4);
        ctx.lineTo(mx + j * 4.5, bb.max.y - 4);
      }
    }
    ctx.stroke();
    ctx.restore();
    // 苔痕
    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = C.moss;
    for (i = 1; i < parts.length; i++) {
      var c = parts[i].position;
      ctx.beginPath(); ctx.arc(c.x, c.y, 3.2, 0, 6.283); ctx.fill();
    }
    ctx.restore();
    // 裂纹随 HP
    if (hurt > 0.25) {
      ctx.save();
      ctx.globalAlpha = Math.min(0.75, hurt);
      ctx.strokeStyle = '#1B1109'; ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(b.position.x - 7, b.position.y - 6);
      ctx.lineTo(b.position.x + 2, b.position.y + 1);
      ctx.lineTo(b.position.x - 3, b.position.y + 8);
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawRilun(b) {
    var r = b.circleRadius, x = b.position.x, y = b.position.y;
    var hurt = 1 - Math.max(0, b.plugin.hp) / b.plugin.maxHp;
    var g = ctx.createRadialGradient(x - r * 0.25, y - r * 0.25, r * 0.1, x, y, r);
    g.addColorStop(0, '#FFE9A8');
    g.addColorStop(0.55, C.rilunRing);
    g.addColorStop(1, C.rilunCore);
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283);
    ctx.fillStyle = g; ctx.fill();
    // 轮辐（全部在半径内 -> 与圆形碰撞体一致）
    ctx.save();
    ctx.translate(x, y); ctx.rotate(b.angle);
    ctx.strokeStyle = 'rgba(255,240,188,0.55)'; ctx.lineWidth = 2;
    ctx.beginPath();
    for (var i = 0; i < 10; i++) {
      var a = i / 10 * 6.283;
      ctx.moveTo(Math.cos(a) * r * 0.42, Math.sin(a) * r * 0.42);
      ctx.lineTo(Math.cos(a) * r * 0.9, Math.sin(a) * r * 0.9);
    }
    ctx.stroke();
    ctx.strokeStyle = 'rgba(160,80,10,0.5)'; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.arc(0, 0, r * 0.42, 0, 6.283); ctx.stroke();
    ctx.restore();
    if (hurt > 0.2) {
      ctx.save(); ctx.globalAlpha = Math.min(0.7, hurt);
      ctx.strokeStyle = '#5A2E06'; ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(x - r * 0.5, y - r * 0.3); ctx.lineTo(x + r * 0.1, y + r * 0.05);
      ctx.lineTo(x - r * 0.15, y + r * 0.55);
      ctx.stroke(); ctx.restore();
    }
  }

  function drawJinwu(b) {
    var parts = b.parts, i, role;
    var roles = b.plugin.roles;
    ctx.lineJoin = 'round';
    // 先整体填色（并集轮廓）
    for (i = 1; i < parts.length; i++) {
      role = roles[i - 1];
      partPath(parts[i]);
      ctx.fillStyle = role === 'body' ? C.jinwuBody
        : role === 'wing' ? C.jinwuWing
        : role === 'head' ? C.jinwuHead
        : role === 'beak' ? C.jinwuBeak
        : role === 'neck' ? '#D2451F'
        : role === 'tail' ? '#EE7A2E'
        : C.jinwuLeg;
      ctx.fill();
    }
    // 焰羽（装饰，画在 body/wing 凸块内部）
    var bodyPart = parts[1], wingPart = parts[6];
    ctx.save();
    ctx.globalAlpha = 0.55; ctx.strokeStyle = C.jinwuFlame; ctx.lineWidth = 2;
    ctx.beginPath();
    for (var f = 0; f < 4; f++) {
      var ox = bodyPart.position.x + (f - 1.5) * 6;
      var oy = bodyPart.position.y + 2;
      ctx.moveTo(ox, oy + 6);
      ctx.quadraticCurveTo(ox + 3, oy, ox, oy - 7);
    }
    ctx.stroke();
    ctx.restore();
    // 翼羽纹
    ctx.save();
    ctx.globalAlpha = 0.5; ctx.strokeStyle = '#8E3A12'; ctx.lineWidth = 1.6;
    ctx.beginPath();
    for (var w = 0; w < 3; w++) {
      var wx = wingPart.position.x + (w - 1) * 7;
      ctx.moveTo(wx, wingPart.position.y - 5);
      ctx.lineTo(wx + 3, wingPart.position.y + 5);
    }
    ctx.stroke();
    ctx.restore();
    // 眼
    var headPart = parts[3];
    ctx.fillStyle = C.jinwuEye;
    ctx.beginPath(); ctx.arc(headPart.position.x + 1.5, headPart.position.y - 1, 2.6, 0, 6.283); ctx.fill();
    ctx.fillStyle = 'rgba(255,220,140,0.9)';
    ctx.beginPath(); ctx.arc(headPart.position.x + 2.4, headPart.position.y - 2, 0.9, 0, 6.283); ctx.fill();
  }

  function drawArrow(b) {
    var parts = b.parts, i;
    ctx.lineJoin = 'round';
    var cols = [C.arrowHead, C.arrowShaft, C.arrowFletch];
    for (i = 1; i < parts.length; i++) {
      partPath(parts[i]);
      ctx.fillStyle = cols[i - 1] || C.arrowShaft; ctx.fill();
    }
    ctx.save();
    ctx.strokeStyle = 'rgba(120,128,140,0.75)'; ctx.lineWidth = 1;
    var hp = parts[1].position;
    ctx.beginPath(); ctx.moveTo(hp.x - 3, hp.y); ctx.lineTo(hp.x + 3, hp.y); ctx.stroke();
    ctx.restore();
  }

  function unionBounds(b) {
    var ps = b.parts, mn = { x: Infinity, y: Infinity }, mx = { x: -Infinity, y: -Infinity };
    for (var i = (ps.length > 1 ? 1 : 0); i < ps.length; i++) {
      var bd = ps[i].bounds;
      if (bd.min.x < mn.x) mn.x = bd.min.x;
      if (bd.min.y < mn.y) mn.y = bd.min.y;
      if (bd.max.x > mx.x) mx.x = bd.max.x;
      if (bd.max.y > mx.y) mx.y = bd.max.y;
    }
    return { min: mn, max: mx };
  }

  /* ---- 调试层：碰撞多边形 + 矩形包围盒 + 幽灵碰撞区 ---- */
  function drawDebug() {
    var bodies = birds.concat(blocks, suns);
    if (arrow) bodies.push(arrow);
    var i, b, j;

    // 幽灵区（bbox 减去轮廓并集）
    ghostCtx.setTransform(1, 0, 0, 1, 0, 0);
    ghostCtx.clearRect(0, 0, WORLD_W, WORLD_H);
    ghostCtx.fillStyle = C.dbgGhost;
    for (i = 0; i < bodies.length; i++) {
      b = bodies[i];
      if (b.plugin.kind === 'rilun') continue;          // 圆本身无幽灵区
      var bb = unionBounds(b);
      ghostCtx.fillRect(bb.min.x, bb.min.y, bb.max.x - bb.min.x, bb.max.y - bb.min.y);
    }
    ghostCtx.globalCompositeOperation = 'destination-out';
    ghostCtx.fillStyle = '#000';
    for (i = 0; i < bodies.length; i++) {
      b = bodies[i];
      if (b.plugin.kind === 'rilun') continue;
      var ps = b.parts;
      for (j = 1; j < ps.length; j++) {
        var v = ps[j].vertices;
        ghostCtx.beginPath();
        ghostCtx.moveTo(v[0].x, v[0].y);
        for (var k = 1; k < v.length; k++) ghostCtx.lineTo(v[k].x, v[k].y);
        ghostCtx.closePath(); ghostCtx.fill();
      }
    }
    ghostCtx.globalCompositeOperation = 'source-over';
    ctx.drawImage(ghostCanvas, 0, 0);

    // 矩形包围盒（紫虚线）
    ctx.save();
    ctx.strokeStyle = C.dbgBox; ctx.lineWidth = 1.4; ctx.setLineDash([6, 5]);
    for (i = 0; i < bodies.length; i++) {
      var bx = unionBounds(bodies[i]);
      ctx.strokeRect(bx.min.x, bx.min.y, bx.max.x - bx.min.x, bx.max.y - bx.min.y);
    }
    ctx.setLineDash([]);
    ctx.restore();

    // 真实碰撞多边形（青线）
    ctx.save();
    ctx.strokeStyle = C.dbgPoly; ctx.lineWidth = 1.6;
    for (i = 0; i < bodies.length; i++) {
      var pp = bodies[i].parts;
      for (j = 1; j < pp.length; j++) partPath(pp[j]), ctx.stroke();
      if (bodies[i].circleRadius) {
        ctx.beginPath();
        ctx.arc(bodies[i].position.x, bodies[i].position.y, bodies[i].circleRadius, 0, 6.283);
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  /* ---- 彤弓 + 弓弦 + 轨迹 ---- */
  function drawBow() {
    var R = 48, a0 = -Math.PI * 0.60, a1 = Math.PI * 0.60;
    var t0 = { x: ANCHOR.x + Math.cos(a0) * R, y: ANCHOR.y + Math.sin(a0) * R };
    var t1 = { x: ANCHOR.x + Math.cos(a1) * R, y: ANCHOR.y + Math.sin(a1) * R };

    // 后羿剪影（装饰，非碰撞）
    ctx.save();
    ctx.fillStyle = 'rgba(12,10,14,0.72)';
    ctx.beginPath();
    ctx.ellipse(ANCHOR.x - 34, ANCHOR.y + 52, 15, 42, -0.06, 0, 6.283); ctx.fill();
    ctx.beginPath(); ctx.arc(ANCHOR.x - 38, ANCHOR.y - 2, 12, 0, 6.283); ctx.fill();
    ctx.strokeStyle = 'rgba(12,10,14,0.72)'; ctx.lineWidth = 9; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(ANCHOR.x - 30, ANCHOR.y + 12); ctx.lineTo(ANCHOR.x - 6, ANCHOR.y - 4); ctx.stroke();
    ctx.restore();

    // 弓臂（彤弓）
    ctx.save();
    ctx.strokeStyle = C.bowDark; ctx.lineWidth = 9; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(ANCHOR.x, ANCHOR.y, R, a0, a1); ctx.stroke();
    ctx.strokeStyle = C.bow; ctx.lineWidth = 5.5;
    ctx.beginPath(); ctx.arc(ANCHOR.x, ANCHOR.y, R, a0, a1); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,190,120,0.45)'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(ANCHOR.x, ANCHOR.y, R - 2.6, a0 + 0.1, a1 - 0.1); ctx.stroke();
    ctx.restore();

    // 弓弦（装饰性，拉到 nock）
    ctx.save();
    ctx.strokeStyle = C.string; ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(t0.x, t0.y); ctx.lineTo(nock.x, nock.y); ctx.lineTo(t1.x, t1.y);
    ctx.stroke();
    ctx.restore();
  }

  function drawTrajectory() {
    if (!previewPts.length) return;
    ctx.save();
    var n = previewPts.length;
    for (var i = 0; i < n; i++) {
      if (i % 3 !== 0) continue;
      var t = i / Math.max(1, n - 1);
      var r = 3.8 * (1 - t * 0.72) + 0.9;
      var a = 0.95 * (1 - t * 0.82) + 0.05;
      ctx.globalAlpha = a * 0.4;
      ctx.fillStyle = C.traj;
      ctx.beginPath(); ctx.arc(previewPts[i].x, previewPts[i].y, r * 2.1, 0, 6.283); ctx.fill();
      ctx.globalAlpha = a;
      ctx.beginPath(); ctx.arc(previewPts[i].x, previewPts[i].y, r, 0, 6.283); ctx.fill();
    }
    ctx.restore();
  }

  function drawNockedArrow() {
    if (!arrow || arrowInFlight) return;
    var v = launchVector();
    var ang = dragActive ? v.angle : 0;
    ctx.save();
    ctx.translate(nock.x, nock.y);
    ctx.rotate(ang);
    var ps = arrow.parts;
    ctx.lineJoin = 'round';
    var cols = [C.arrowHead, C.arrowShaft, C.arrowFletch];
    for (var i = 1; i < ps.length; i++) {
      var vts = ps[i].vertices;
      var cx = arrow.position.x, cy = arrow.position.y;
      ctx.beginPath();
      ctx.moveTo(vts[0].x - cx, vts[0].y - cy);
      for (var k = 1; k < vts.length; k++) ctx.lineTo(vts[k].x - cx, vts[k].y - cy);
      ctx.closePath();
      ctx.fillStyle = cols[i - 1] || C.arrowShaft; ctx.fill();
    }
    ctx.restore();
  }

  function drawParticles() {
    var i, p;
    ctx.save();
    for (i = 0; i < particles.length; i++) {
      p = particles[i];
      var a = 1 - p.life / p.max;
      ctx.globalAlpha = Math.max(0, a);
      ctx.fillStyle = p.c;
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      if (p.feather) {
        ctx.beginPath();
        ctx.ellipse(0, 0, p.r * 1.7, p.r * 0.5, 0, 0, 6.283);
        ctx.fill();
      } else if (p.sq) {
        ctx.fillRect(-p.r, -p.r * 0.7, p.r * 2, p.r * 1.4);
      } else {
        ctx.beginPath(); ctx.arc(0, 0, p.r, 0, 6.283); ctx.fill();
      }
      ctx.restore();
    }
    ctx.restore();
    ctx.save();
    for (i = 0; i < rings.length; i++) {
      var rg = rings[i], t = rg.t / 26;
      ctx.globalAlpha = (1 - t) * (rg.big ? 0.8 : 0.5);
      ctx.strokeStyle = rg.big ? '#FFB054' : '#FFE9A8';
      ctx.lineWidth = rg.big ? 3.4 : 2;
      ctx.beginPath(); ctx.arc(rg.x, rg.y, rg.r + t * (rg.big ? 62 : 26), 0, 6.283); ctx.stroke();
    }
    ctx.restore();
  }

  function drawRangeOverlay() {
    if (mode !== 'range' || !rangeBird) return;
    ctx.save();
    ctx.fillStyle = 'rgba(240,194,74,0.9)';
    ctx.font = '700 22px "Kaiti SC","STKaiti",serif';
    ctx.textAlign = 'center';
    ctx.fillText('碰撞精度靶场 · 金乌悬空', 640, 96);
    ctx.font = '15px "Kaiti SC","STKaiti",serif';
    ctx.fillStyle = 'rgba(180,200,224,0.85)';
    ctx.fillText('紫雾 = 矩形包围盒会误判的「幽灵碰撞区」，轮廓碰撞体不会', 640, 122);
    ctx.restore();
  }

  function render() {
    beginWorld();
    drawSky();
    var i, bodies = blocks.concat(suns, birds);
    for (i = 0; i < bodies.length; i++) drawBody(bodies[i]);
    if (arrow && arrowInFlight) drawBody(arrow);
    drawParticles();
    if (debugOn) drawDebug();
    drawRangeOverlay();
    if (mode === 'level') { drawBow(); drawTrajectory(); drawNockedArrow(); }
    else if (arrow && !arrowInFlight) { drawNockedArrow(); }
  }

  /* ==========================================================================
     13. 主循环（固定步长累加器）
     ========================================================================== */
  var acc = 0, last = performance.now(), fpsAcc = 0, fpsN = 0, fpsShown = 0;

  function stepOnce() {
    frameCount++;
    M.Engine.update(engine, STEP);
    stepParticles();
    if (arrowInFlight && arrow) {
      flightFrames++;
      var sp = M.Body.getSpeed(arrow);
      if (sp > MAX_SPEED) M.Body.setSpeed(arrow, MAX_SPEED);
      if (sp > 1) {
        M.Body.setAngle(arrow, Math.atan2(arrow.velocity.y, arrow.velocity.x));   // 箭头始终指前
        M.Sleeping.set(arrow, false);
      }
      arrowTrack.push({ x: +arrow.position.x.toFixed(2), y: +arrow.position.y.toFixed(2), f: flightFrames });
      slowFrames = sp < 0.6 ? slowFrames + 1 : 0;
      var p = arrow.position;
      if (p.x < -120 || p.x > WORLD_W + 120 || p.y > WORLD_H + 240 || slowFrames > 45 || flightFrames > 620) {
        retireArrow();
      }
    }
    if (pendingRetire > 0) { pendingRetire--; if (pendingRetire === 0) { loadArrow(); checkEnd(); } }
    checkLose();
  }

  function loop(now) {
    var dt = now - last; last = now;
    if (dt > 0) { fpsAcc += 1000 / dt; fpsN++; }
    acc += Math.min(dt, 120);
    var guard = 0;
    while (acc >= STEP && guard < 6) { stepOnce(); acc -= STEP; guard++; }
    if (acc > STEP * 6) acc = 0;
    render();
    if (fpsN >= 30) { fpsShown = Math.round(fpsAcc / fpsN); fpsAcc = 0; fpsN = 0; updateHud(); }
    requestAnimationFrame(loop);
  }

  /* ==========================================================================
     15. 靶场：自动求一个「大幽灵区」靶点 + 求解发射矢量
     ========================================================================== */
  function pip(vs, x, y) {
    var inside = false;
    for (var i = 0, j = vs.length - 1; i < vs.length; j = i++) {
      var xi = vs[i].x, yi = vs[i].y, xj = vs[j].x, yj = vs[j].y;
      if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
    }
    return inside;
  }
  function inSilhouette(b, x, y) {
    var ps = b.parts;
    if (b.circleRadius) return Math.hypot(x - b.position.x, y - b.position.y) <= b.circleRadius;
    for (var i = 1; i < ps.length; i++) if (pip(ps[i].vertices, x, y)) return true;
    return false;
  }
  function inBBox(b, x, y) {
    var bb = unionBounds(b);
    return x >= bb.min.x && x <= bb.max.x && y >= bb.min.y && y <= bb.max.y;
  }

  /* 在 bbox 内找出所有「以 clearance 为半径完全落在幽灵区」的候选靶点。
     幽灵区 = 矩形包围盒会误判为碰撞、而轮廓碰撞体不会的区域。 */
  function findGhostPoints(b, clearance) {
    var bb = unionBounds(b), out = [], x, y, a, clear, th;
    for (x = bb.min.x + 2; x <= bb.max.x - 2; x += 4) {
      for (y = bb.min.y + 2; y <= bb.max.y - 2; y += 4) {
        if (inSilhouette(b, x, y)) continue;
        clear = true;
        for (a = 0; a < 16; a++) {
          th = a / 16 * 6.283;
          if (inSilhouette(b, x + Math.cos(th) * clearance, y + Math.sin(th) * clearance)) { clear = false; break; }
        }
        if (!clear) continue;
        out.push({ x: x, y: y });
      }
    }
    var w = bb.max.x - bb.min.x, h = bb.max.y - bb.min.y;
    out.sort(function (p, q) {
      var sp = (p.x - bb.min.x) / w * 1.2 + (p.y - bb.min.y) / h;
      var sq = (q.x - bb.min.x) / w * 1.2 + (q.y - bb.min.y) / h;
      return sq - sp;          // 靠右下的角优先（箭自左飞来最自然）
    });
    return out;
  }
  function findGhostPoint(b, clearance) {
    var l = findGhostPoints(b, clearance);
    return l.length ? l[0] : null;
  }

  /* 求解：遍历 (角度, 力度)，用与预览完全相同的积分器模拟。
     第一阶段只找「箭心轨迹经过靶点 ±4px」的弹道（便宜）；
     第二阶段才对候选做昂贵的「箭体全程不触轮廓」校验。
     箭体朝向用瞬时速度方向 —— 与游戏内 setAngle(atan2(vy,vx)) 同源。 */
  function solveAim(tx, ty, requireMiss, targetBody) {
    var cands = [], ai, pw, ang, vx, vy, pts, i, err;
    for (ai = 0; ai <= 176; ai++) {
      ang = (-88 + ai * 1.0) * Math.PI / 180;
      for (pw = 6; pw <= MAX_PULL * POWER_SCALE + 0.001; pw += 0.5) {
        vx = Math.cos(ang) * pw; vy = Math.sin(ang) * pw;
        pts = simulate(nock.x, nock.y, vx, vy, 170);
        for (i = 0; i < pts.length; i++) {
          err = Math.hypot(pts[i].x - tx, pts[i].y - ty);
          if (err <= 4) { cands.push({ vx: vx, vy: vy, ang: ang, pw: pw, err: err, pts: pts }); break; }
        }
      }
    }
    cands.sort(function (a, b) { return a.err - b.err; });
    if (!cands.length) return null;
    if (!requireMiss) {
      var c0 = cands[0];
      return { vx: c0.vx, vy: c0.vy, ang: c0.ang, pw: c0.pw, err: c0.err, passesThroughBBox: false };
    }
    for (i = 0; i < cands.length && i < 60; i++) {
      var chk = checkArrowMisses(cands[i].pts, targetBody);
      if (chk.ok && chk.inBox) {
        cands[i].passesThroughBBox = true;
        return { vx: cands[i].vx, vy: cands[i].vy, ang: cands[i].ang, pw: cands[i].pw, err: cands[i].err, passesThroughBBox: true };
      }
    }
    return null;
  }

  /* 沿弹道逐步摆放箭体（52 长，9 个采样点），全程不得进入轮廓；
     同时确认箭心确实进入过矩形包围盒（否则对照无意义）。 */
  function checkArrowMisses(pts, b) {
    var inBox = false, s, q, seg, off, sx, sy;
    var offsets = [-25, -19, -13, -7, 0, 7, 13, 20, 27];
    for (s = 0; s < pts.length; s++) {
      if (inBBox(b, pts[s].x, pts[s].y)) inBox = true;
      seg = Math.atan2(pts[s].vy, pts[s].vx);
      for (q = 0; q < offsets.length; q++) {
        off = offsets[q];
        sx = pts[s].x + Math.cos(seg) * off;
        sy = pts[s].y + Math.sin(seg) * off;
        if (inSilhouette(b, sx, sy)) return { ok: false, inBox: inBox };
      }
    }
    return { ok: true, inBox: inBox };
  }

  function rangeShot(kind) {
    if (mode !== 'range' || !rangeBird) return null;
    if (arrowInFlight) { showVerdict('上一箭尚在飞行，请稍候', 'info'); return null; }
    var sol, gp;
    if (kind === 'ghost') {
      var cands = findGhostPoints(rangeBird, 30);
      if (!cands.length) { showVerdict('未找到足够大的幽灵区靶点', 'bad'); return null; }
      for (var ci = 0; ci < cands.length && ci < 40; ci++) {
        sol = solveAim(cands[ci].x, cands[ci].y, true, rangeBird);
        if (sol) { gp = cands[ci]; break; }
      }
      if (!sol || !gp) { showVerdict('未能求出「穿过幽灵区且不碰轮廓」的弹道', 'bad'); return null; }
      rangeVerdict = { kind: 'ghost', expect: 'MISS', target: gp, sol: sol, hitsBefore: hitLog.length };
      showVerdict('靶点 (' + Math.round(gp.x) + ',' + Math.round(gp.y) + ') 在金乌<b>矩形包围盒内</b>、<b>轮廓之外</b>；' +
        '弹道已求解并保证箭体全程不触轮廓。<br>若碰撞体是矩形 → 必判 HIT；若是轮廓 → 应 MISS。', 'info');
    } else {
      var bp = rangeBird.parts[1].position;      // 鸟身凸块中心
      sol = solveAim(bp.x, bp.y, false, null);
      if (!sol) { showVerdict('未能求出命中鸟身的弹道', 'bad'); return null; }
      rangeVerdict = { kind: 'body', expect: 'HIT', target: { x: bp.x, y: bp.y }, sol: sol, hitsBefore: hitLog.length };
      showVerdict('靶点 = 鸟身凸块中心 (' + Math.round(bp.x) + ',' + Math.round(bp.y) + ')，应判 HIT 并击杀。', 'info');
    }
    debugOn = true; syncButtons();
    nock.x = ANCHOR.x; nock.y = ANCHOR.y;
    launch(sol.vx, sol.vy, ANCHOR.x, ANCHOR.y);
    return sol;
  }

  function reportRange() {
    if (!rangeVerdict) return;
    var rv = rangeVerdict;
    var newHits = hitLog.slice(rv.hitsBefore).filter(function (h) { return h.kind === 'jinwu'; });
    var hit = newHits.length > 0;
    var pass = (rv.expect === 'HIT') === hit;
    var boxNote = rv.kind === 'ghost'
      ? (rv.sol.passesThroughBBox ? '箭心轨迹<b>确实穿过</b>了矩形包围盒' : '⚠ 轨迹未穿过包围盒，本次对照无效')
      : '—';
    var msg = '<b>' + (rv.expect === 'HIT' ? '射鸟身' : '射空白角') + '</b> · 期望 ' + rv.expect +
      ' · 实测 <b>' + (hit ? 'HIT' : 'MISS') + '</b> → ' + (pass ? '<b>✅ 通过</b>' : '<b>❌ 不符</b>') +
      '<br>' + boxNote + ' · 金乌命中记录 ' + newHits.length + ' 条' +
      (newHits.length ? '（冲击 ' + newHits[0].impact + '，伤害 ' + newHits[0].dmg + '）' : '');
    showVerdict(msg, pass ? 'ok' : 'bad');
    rangeVerdict.done = true;
    return pass;
  }

  /* ==========================================================================
     17. 测试 API（Playwright 驱动）
     ========================================================================== */
  window.__houyi = {
    version: 'prototype-1',
    matterVersion: M.version,
    warnings: function () { return warnings.slice(); },
    config: function () {
      return {
        step: STEP, gravStepY: +GRAV_STEP_Y.toFixed(6), gravStepX: GRAV_STEP_X,
        maxPull: MAX_PULL, powerScale: POWER_SCALE, maxSpeed: MAX_SPEED,
        damageScale: DAMAGE_SCALE, minImpact: MIN_IMPACT, hp: HP, birdScale: BIRD_SCALE,
        worldW: WORLD_W, worldH: WORLD_H, groundY: GROUND_Y, anchor: ANCHOR
      };
    },
    mode: function () { return mode; },
    state: function () {
      return {
        mode: mode, phase: phase, arrowsLeft: arrowsLeft, birdsAlive: birds.length,
        blocksAlive: blocks.length, sunsAlive: suns.length,
        arrowInFlight: arrowInFlight, flightFrames: flightFrames, debug: debugOn,
        frame: frameCount
      };
    },
    bodies: function () {
      var out = [];
      birds.concat(blocks, suns).forEach(function (b) {
        var bb = unionBounds(b);
        out.push({
          kind: b.plugin.kind, label: b.plugin.label, hp: +Math.max(0, b.plugin.hp).toFixed(1),
          maxHp: b.plugin.maxHp, x: +b.position.x.toFixed(1), y: +b.position.y.toFixed(1),
          angle: +b.angle.toFixed(3), sleeping: !!b.isSleeping, isStatic: !!b.isStatic,
          parts: b.parts.length - 1, circle: b.circleRadius || null,
          w: +(bb.max.x - bb.min.x).toFixed(1), h: +(bb.max.y - bb.min.y).toFixed(1)
        });
      });
      return out;
    },
    shapeAudit: function () {
      // 逐实体核对：碰撞体是否「非矩形」——把凸块并集面积与 bbox 面积对比
      var out = [];
      birds.concat(blocks, suns).forEach(function (b) {
        var bb = unionBounds(b);
        var boxArea = (bb.max.x - bb.min.x) * (bb.max.y - bb.min.y);
        var polyArea = 0;
        if (b.circleRadius) polyArea = Math.PI * b.circleRadius * b.circleRadius;
        else {
          for (var i = 1; i < b.parts.length; i++) polyArea += Math.abs(M.Vertices.area(b.parts[i].vertices));
        }
        out.push({
          kind: b.plugin.kind, shape: b.plugin.shapeName || 'circle',
          parts: b.parts.length - 1, isCircle: !!b.circleRadius,
          fillRatio: +(polyArea / boxArea).toFixed(3),   // 1.0 = 矩形；<1 = 异形
          isRectangleLike: polyArea / boxArea > 0.985
        });
      });
      return out;
    },
    hitLog: function () { return hitLog.slice(); },
    arrowInfo: function () {
      if (!arrow) return null;
      var bb = unionBounds(arrow), polyArea = 0, i;
      for (i = 1; i < arrow.parts.length; i++) polyArea += Math.abs(M.Vertices.area(arrow.parts[i].vertices));
      var w = bb.max.x - bb.min.x, h = bb.max.y - bb.min.y;
      return {
        parts: arrow.parts.length - 1, isCircle: false,
        w: +w.toFixed(1), h: +h.toFixed(1), aspect: +(w / h).toFixed(2),
        fillRatio: +(polyArea / (w * h)).toFixed(3),
        frictionAir: arrow.frictionAir, indestructible: !!arrow.plugin.indestructible
      };
    },
    clearLog: function () { hitLog.length = 0; },
    arrowTrack: function () { return arrowTrack.slice(); },
    setDebug: function (v) { debugOn = !!v; syncButtons(); return debugOn; },
    reset: function () { elBanner.className = ''; hideVerdict(); if (mode === 'level') buildLevel(); else buildRange(); updateHud(); return true; },
    setMode: function (m) {
      mode = (m === 'range') ? 'range' : 'level';
      elBanner.className = ''; hideVerdict();
      if (mode === 'range') { debugOn = true; buildRange(); } else buildLevel();
      syncButtons(); updateHud(); return mode;
    },
    step: function (n) { n = n || 1; for (var i = 0; i < n; i++) stepOnce(); return true; },
    launch: function (vx, vy, x, y) { return launch(vx, vy, x === undefined ? ANCHOR.x : x, y === undefined ? ANCHOR.y : y); },
    drag: function (px, py) { if (mode !== 'level') return false; dragActive = true; setNock({ x: px, y: py }); return previewPts.length; },
    release: function () { var v = launchVector(); dragActive = false; return launch(v.vx, v.vy); },
    preview: function (px, py) {
      if (mode !== 'level') return null;
      setNock({ x: px, y: py });
      var v = launchVector();
      return {
        nock: { x: +nock.x.toFixed(2), y: +nock.y.toFixed(2) },
        vx: +v.vx.toFixed(4), vy: +v.vy.toFixed(4), power: +v.power.toFixed(4), angleDeg: +(v.angle * 180 / Math.PI).toFixed(2),
        points: previewPts.map(function (p) { return { x: +p.x.toFixed(3), y: +p.y.toFixed(3), i: p.i }; })
      };
    },
    anchor: function () { return { x: ANCHOR.x, y: ANCHOR.y }; },
    view: function () {
      return {
        scale: scale, offX: offX, offY: offY, dpr: dpr,
        cssW: canvas.width / dpr, cssH: canvas.height / dpr,
        devW: canvas.width, devH: canvas.height, worldW: WORLD_W, worldH: WORLD_H
      };
    },
    /* 批量采样渲染后的真实像素（一次 getImageData，避免逐点开销）。
       用来量化证明「画出来的轮廓 == 碰撞轮廓」（所见即所撞）。 */
    samplePixels: function (pts) {
      var img = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
      var out = [], i, dx, dy, o;
      for (i = 0; i < pts.length; i++) {
        dx = Math.round((pts[i][0] * scale + offX) * dpr);
        dy = Math.round((pts[i][1] * scale + offY) * dpr);
        if (dx < 0 || dy < 0 || dx >= canvas.width || dy >= canvas.height) { out.push(null); continue; }
        o = (dy * canvas.width + dx) * 4;
        out.push([img[o], img[o + 1], img[o + 2]]);
      }
      return out;
    },
    samplePixel: function (wx, wy) {
      var d = this.samplePixels([[wx, wy]])[0];
      return d ? { r: d[0], g: d[1], b: d[2] } : null;
    },
    // 轮廓 vs 包围盒判定
    silhouetteTest: function (kindFilter, x, y) {
      var b = birds.concat(blocks, suns).filter(function (t) { return !kindFilter || t.plugin.kind === kindFilter; })[0];
      if (!b) return null;
      return {
        kind: b.plugin.kind, x: x, y: y,
        inSilhouette: inSilhouette(b, x, y), inBBox: inBBox(b, x, y),
        ghost: inBBox(b, x, y) && !inSilhouette(b, x, y)
      };
    },
    ghostStats: function (kindFilter) {
      var out = [];
      birds.concat(blocks, suns).forEach(function (b) {
        if (kindFilter && b.plugin.kind !== kindFilter) return;
        var bb = unionBounds(b), ghost = 0, total = 0;
        for (var x = bb.min.x; x <= bb.max.x; x += 2) {
          for (var y = bb.min.y; y <= bb.max.y; y += 2) {
            total++; if (!inSilhouette(b, x, y)) ghost++;
          }
        }
        out.push({
          kind: b.plugin.kind, x: +b.position.x.toFixed(1), y: +b.position.y.toFixed(1),
          bbox: { x0: +bb.min.x.toFixed(1), y0: +bb.min.y.toFixed(1), x1: +bb.max.x.toFixed(1), y1: +bb.max.y.toFixed(1) },
          ghostRatio: +(ghost / total).toFixed(3)
        });
      });
      return out;
    },
    findGhostPoint: function (clearance) {
      var b = birds[0]; if (!b) return null;
      var gp = findGhostPoint(b, clearance || 30);
      if (!gp) return null;
      return { x: gp.x, y: gp.y, inBBox: inBBox(b, gp.x, gp.y), inSilhouette: inSilhouette(b, gp.x, gp.y), bird: { x: b.position.x, y: b.position.y } };
    },
    solveAim: function (tx, ty, requireMiss) {
      var s = solveAim(tx, ty, !!requireMiss, requireMiss ? birds[0] : null);
      return s ? { vx: +s.vx.toFixed(4), vy: +s.vy.toFixed(4), power: +s.pw.toFixed(3), angleDeg: +(s.ang * 180 / Math.PI).toFixed(2), err: +s.err.toFixed(3), passesThroughBBox: s.passesThroughBBox } : null;
    },
    rangeShot: function (kind) {
      var s = rangeShot(kind);
      return s ? { vx: +s.vx.toFixed(4), vy: +s.vy.toFixed(4), passesThroughBBox: s.passesThroughBBox } : null;
    },
    reportRange: function () { return reportRange(); },
    autoTest: function () { autoTest(); return true; },
    autoResults: function () { return autoResults.slice(); }
  };

  updateHud();
  if (warnings.length) {
    showVerdict('⚠ 碰撞体警告 ' + warnings.length + ' 条：' + warnings[0], 'bad');
  } else {
    showVerdict('物理内核就绪 · Matter.js ' + M.version + ' · 所有碰撞凸块已校验为凸多边形（凹轮廓手工拆分，未被 hull）', 'ok');
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
