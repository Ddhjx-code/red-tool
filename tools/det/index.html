<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <link rel="icon" href="data:," />
  <title>小方块变形记</title>
  <link rel="stylesheet" href="./assets/app.css" />
  <link rel="stylesheet" href="./assets/det.css" />
</head>
<body>
<div id="app">
  <div id="head">
    <div id="step">任务 1 / 3</div>
    <div id="title">把它撑到 2 倍大</div>
    <div id="hint">拖住两个圆环，把它拉开</div>
  </div>

  <div id="stage">
    <svg id="paper" viewBox="0 0 390 470" preserveAspectRatio="xMidYMid meet">
      <g id="grid"></g>
      <g id="creature">
        <path id="shadow" d="" fill="rgba(35,32,28,0.07)" transform="translate(5 7)" />
        <path id="body" d="" fill="#F8D27C" stroke="#23201C" stroke-width="3" stroke-linejoin="round" />
      </g>
      <path id="unitSq" d="" fill="none" stroke="#8C6A2A" stroke-width="1.4" stroke-dasharray="5 5" opacity="0.34" />
      <g id="face">
        <circle class="eye" id="eyeL" cx="-15" cy="-6" r="6" fill="#23201C" />
        <circle class="eye" id="eyeR" cx="15" cy="-6" r="6" fill="#23201C" />
        <path id="mouth" d="M-8 6q8 7 16 0" fill="none" stroke="#23201C" stroke-width="2.8" stroke-linecap="round" />
        <ellipse id="blushL" cx="-26" cy="6" rx="7" ry="4.2" fill="#E77E86" opacity="0.42" />
        <ellipse id="blushR" cx="26" cy="6" rx="7" ry="4.2" fill="#E77E86" opacity="0.42" />
      </g>
      <text id="dots" x="0" y="0" text-anchor="middle" font-size="17" fill="#8C8378" opacity="0">···</text>
      <circle id="h1" class="handle" r="12.5" fill="#FFFDF9" stroke="#BA7517" stroke-width="3" />
      <circle id="h2" class="handle" r="12.5" fill="#FFFDF9" stroke="#BA7517" stroke-width="3" />
    </svg>
  </div>

  <div id="foot">
    <div id="badge"><span id="badgeNum">×1.8</span></div>
    <div id="stickers">
      <span class="stk" id="s1">撑大</span>
      <span class="stk" id="s2">翻面</span>
      <span class="stk" id="s3">压扁</span>
    </div>
  </div>

  <div id="done">
    <div class="card">
      <div class="ttl">三张贴纸都拿到了</div>
      <div class="rows">
        <div class="row"><b>撑大</b><span>你调的那个倍数，就是行列式</span></div>
        <div class="row"><b>翻面</b><span>所以行列式会有负数</span></div>
        <div class="row"><b>压扁</b><span>倍数变成 0，就回不来了</span></div>
      </div>
      <div class="punch">原来你一直在调的那个倍数<br>就是行列式。</div>
      <button id="again">再玩一次</button>
    </div>
  </div>
</div>

<script src="./assets/det.js"></script>
</body>
</html>
