<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>舞火龙</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: #070c12;
      color: #e8e2d4;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    .view { position: fixed; top: 0; right: 0; bottom: 0; left: 0; display: none; }
    .view.on { display: block; }
    .boot-in {
      position: absolute; top: 0; right: 0; bottom: 0; left: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .cta {
      min-height: 48px; padding: 0 30px; margin-top: 34px;
      background: #ff8a3d; color: #070c12;
      border: 0; border-radius: 24px;
      font-family: inherit; font-size: 16px; font-weight: 700; letter-spacing: 0.1em;
    }
    #stage {
      position: absolute; top: 0; right: 0; bottom: 0; left: 0;
      display: block; width: 100%; height: 100%;
    }
    #warn {
      position: fixed; top: 0; right: 0; left: 0;
      padding: 14px 18px;
      background: #7a2118; color: #ffe9b0;
      font-size: 14px; line-height: 1.7;
      z-index: 99;
    }
  </style>
  <link rel="stylesheet" href="./assets/style.css" />
</head>
<body>
  <div id="warn">
    资源没加载到：<b>请先解压 zip，再打开解压出来的 index.html</b>（不要直接在压缩包里双击打开）。
  </div>
  <div id="v-boot" class="view on">
    <div class="boot-in">
      <div class="boot-seal">中秋</div>
      <h1 class="boot-title">舞火龙</h1>
      <p class="boot-sub">大坑 · 国家级非遗 Ⅹ-5</p>
      <p class="boot-line">你是一条插满香火的火龙。<br />在夜里的街巷推到瘟神面前，然后送它归天。</p>
      <button id="btn-start" class="cta" type="button">起龙</button>
    </div>
  </div>

  <div id="v-stage" class="view">
    <canvas id="stage"></canvas>
    <div id="hud">
      <div id="hud-fire"><i></i></div>
      <div id="hud-row">
        <div id="hud-skills">
          <div class="sk" id="sk-thrust">
            <svg viewBox="0 0 32 32" aria-hidden="true">
              <path class="pole" d="M6 26 L21 11" />
              <path class="blade" d="M21 11 L28 4 L25 13 L15 17 Z" />
              <path class="spark" d="M3 29 L9 23 M29 3 L23 9" />
            </svg>
            <span class="mask"></span>
            <span class="lbl">刺</span>
            <span class="cost"></span>
          </div>
          <div class="sk" id="sk-tail">
            <svg viewBox="0 0 32 32" aria-hidden="true">
              <path class="arc" d="M3 27 C3 13 13 5 28 7" />
              <path class="blade" d="M28 7 L21 3 L23 12 Z" />
            </svg>
            <span class="mask"></span>
            <span class="lbl">甩</span>
            <span class="cost"></span>
          </div>
        </div>
        <div id="hud-combo"><b></b><i></i></div>
      </div>
      <div id="hud-boss"><b>瘟 神</b><span><i></i></span><em></em></div>
      <div id="hud-incense">添 香</div>
      <div id="hud-beat"></div>
      <button id="btn-mute" type="button">声</button>
    </div>
    <div id="pad">
      <div class="padl">
        <button id="btn-left" type="button">左</button>
        <button id="btn-right" type="button">右</button>
      </div>
      <div class="padr">
        <button id="btn-jump" type="button">跳</button>
        <button id="btn-tail" type="button">甩</button>
        <button id="btn-thrust" type="button">刺</button>
      </div>
    </div>
  </div>

  <div id="v-return" class="view">
    <div id="return-note"></div>
  </div>

  <div id="v-result" class="view">
    <div id="result"></div>
    <img id="result-card" alt="舞火龙通关分享卡" />
    <div class="result-acts">
      <button id="btn-album" class="cta" type="button">存到相册</button>
      <button id="btn-note" class="cta cta-ghost" type="button">发笔记</button>
    </div>
  </div>

  <div id="toast"></div>

  <script src="./assets/data.js"></script>
  <script src="./assets/rng.js"></script>
  <script src="./assets/chain.js"></script>
  <script src="./assets/fire.js"></script>
  <script src="./assets/scene.js"></script>
  <script src="./assets/player.js"></script>
  <script src="./assets/boss.js"></script>
  <script src="./assets/audio.js"></script>
  <script src="./assets/share.js"></script>
  <script src="./assets/game.js"></script>
  <script src="./assets/anim.js"></script>
  <script src="./assets/main.js"></script>
</body>
</html>
