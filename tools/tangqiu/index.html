<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>糖球转转</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div id="app">

  <canvas id="cv"></canvas>

  <div id="hud">
    <div id="hearts"></div>
    <div id="clock">1:30</div>
    <div id="killBox"><b id="kills">0</b><span>只</span></div>
    <div id="lvbar"><i id="lvfill"></i><b id="lvtxt">Lv.1</b></div>
    <div id="stageBadge"></div>
  </div>

  <div id="joy"><div id="knob"></div></div>

  <div id="levelCard" class="screen">
    <div class="lc-in">
      <div class="lc-no" id="lcNo">第 1 关</div>
      <div class="lc-name" id="lcName">糖果工厂</div>
      <div class="lc-sub" id="lcSub">布丁从这儿下线</div>
    </div>
  </div>

  <div id="start" class="screen on">
    <div class="start-in">
      <div class="logo">糖球转转</div>
      <div class="sub">七关闯关 · 拖摇杆走位<br>武器自己会打</div>
      <div class="skin-row" id="skinRow"></div>
      <div class="stage-row" id="stageRow"></div>
      <button id="startBtn" class="btn">开始闯关</button>
      <div class="best" id="bestTxt"></div>
      <div class="start-hint" id="startHint"></div>
    </div>
  </div>

  <div id="up" class="screen">
    <div class="up-in">
      <div class="up-kick">升到 <b id="upLv">2</b> 级</div>
      <div class="up-sub">挑一个带走</div>
      <div id="upCards"></div>
    </div>
  </div>

  <div id="over" class="screen">
    <div class="over-in">
      <div class="over-kick" id="overKick">第 1 关通过</div>
      <div class="over-title" id="overTitle">糖果工厂</div>
      <div class="over-stats" id="overStats"></div>
      <div class="over-weap" id="overWeap"></div>
      <div class="over-btns">
        <button id="shareBtn" class="btn ghost">存成图</button>
        <button id="againBtn" class="btn">下一关</button>
      </div>
      <div class="over-hint" id="overHint"></div>
    </div>
  </div>

</div>
<script src="assets/game.js"></script>
</body>
</html>
