<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#FBF3E2">
<title>小摊记</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<canvas id="cv" aria-hidden="true"></canvas>
<div id="veil"></div>

<div id="app">

  <header id="hud">
    <div class="hud-l">
      <span class="hud-k">家底</span>
      <b id="hudCoins">0</b>
      <span class="hud-u">文</span>
    </div>
    <div class="hud-c" id="hudTime">辰时</div>
    <div class="hud-r">
      <span class="hud-k">第</span>
      <b id="hudRound">1</b>
      <span class="hud-k">摊</span>
    </div>
  </header>

  <!-- ===== 封面 ===== -->
  <section class="scene on" id="s-intro">
    <div class="intro-wrap">
      <div class="intro-seal">市</div>
      <div class="intro-side">市井百态</div>
      <h1 class="intro-title">小摊记</h1>
      <p class="intro-poem">一盏粗茶<br>半幅青布<br>看今日赚得几文</p>
      <div class="intro-rule">
        <div class="rule-row"><i>一</i><span>早市进货，货挑贵贱</span></div>
        <div class="rule-row"><i>二</i><span>开价定高低，客人会还价</span></div>
        <div class="rule-row"><i>三</i><span>收摊结账，题一句词</span></div>
      </div>
      <button class="btn btn-main" data-act="Start">开 张</button>
      <div class="intro-best">最好的一摊 <b id="bestProfit">0</b> 文</div>
    </div>
  </section>

  <!-- ===== 进货 ===== -->
  <section class="scene" id="s-buy">
    <div class="sc-head">
      <div class="sc-t">早市 · 进货</div>
      <div class="sc-d" id="dayBrief">晴，赶集的人不少</div>
    </div>
    <div class="sc-body" id="buyList"></div>
    <div class="sc-foot">
      <div class="cash">
        <span class="cash-k">余钱</span>
        <b id="cashLeft">100</b>
        <span class="cash-u">文</span>
      </div>
      <button class="btn btn-main" data-act="ToPrice">摆 摊</button>
    </div>
  </section>

  <!-- ===== 定价 ===== -->
  <section class="scene" id="s-price">
    <div class="sc-head">
      <div class="sc-t">开价 · 招徕</div>
      <div class="sc-d">今日集市：<b id="dayTip">—</b></div>
    </div>
    <div class="sign-row" id="signRow">
      <button class="chip" data-act="Sign" data-id="0"><b>静坐等客</b><i>价钱照开，来去自如</i></button>
      <button class="chip" data-act="Sign" data-id="1"><b>高声吆喝</b><i>多来两位，价得让一分</i></button>
      <button class="chip" data-act="Sign" data-id="2"><b>挂出招牌</b><i>客少一两位，出价肯高些</i></button>
    </div>
    <div class="sc-body" id="priceList"></div>
    <div class="sc-foot">
      <div class="cash">
        <span class="cash-k">本钱</span>
        <b id="costLeft">0</b>
        <span class="cash-u">文</span>
      </div>
      <button class="btn btn-main" data-act="Open">开 市</button>
    </div>
  </section>

  <!-- ===== 开市 ===== -->
  <section class="scene" id="s-market">
    <div class="mk-top">
      <div class="mk-stat"><span>来客</span><b id="mkCome">0</b></div>
      <div class="mk-stat"><span>成交</span><b id="mkSold">0</b></div>
      <div class="mk-stat"><span>进账</span><b id="mkRev">0</b></div>
      <div class="mk-clock" id="mkClock">辰时·开市</div>
    </div>

    <div class="mk-stage">
      <div class="bubble" id="bubble"></div>
      <div class="mk-feed" id="feed"></div>
      <div class="mk-left" id="mkLeft"></div>
    </div>

    <div class="mk-bar"><div class="mk-bar-in" id="mkBar"></div></div>

    <div class="mk-foot">
      <button class="btn btn-ghost" data-act="Skip">快 进</button>
    </div>
  </section>

  <!-- ===== 结算 ===== -->
  <section class="scene" id="s-result">
    <div class="rs-card" id="rsCard">
      <div class="rs-seal" id="rsSeal">盈</div>
      <div class="rs-head">
        <div class="rs-title" id="rsTitle">收摊</div>
        <div class="rs-sub" id="rsSub">—</div>
      </div>
      <div class="rs-profit">
        <span class="rs-pk">这一摊净赚</span>
        <b id="rsProfit">0</b>
        <span class="rs-pu">文</span>
      </div>
      <div class="rs-couplet" id="rsCouplet">—</div>
      <div class="rs-lines" id="rsLines"></div>
      <div class="rs-comment" id="rsComment">—</div>
      <div class="rs-stars" id="rsStars"></div>
      <div class="rs-foot">小摊记</div>
    </div>
    <div class="rs-btns">
      <button class="btn btn-main" data-act="Again">再摆一摊</button>
    </div>
  </section>

</div>

<script src="assets/art.js"></script>
<script src="assets/game.js"></script>
</body>
</html>
