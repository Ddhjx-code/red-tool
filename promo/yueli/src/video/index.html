<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<style>
  :root {
    --paper: #faf7f2;
    --ink: #2b2724;
    --ink-2: #7a726a;
    --red: #c8503c;
    --serif: "Songti SC", "Source Han Serif SC", Georgia, serif;
    --sans: -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif;
    --t: 0s;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--paper);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  .stage {
    position: relative;
    width: 1080px; height: 1920px;
    overflow: hidden;
    background: var(--paper);
  }
  .stage::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0.45;
    background-image: radial-gradient(rgba(120, 100, 80, 0.05) 1px, transparent 1px);
    background-size: 3px 3px;
  }

  /* 统一用 17s 时间轴，冻结在 --t */
  .a17 {
    animation-duration: 17s;
    animation-fill-mode: both;
    animation-play-state: paused;
    animation-timing-function: cubic-bezier(0.22, 0.61, 0.36, 1);
    animation-delay: calc(var(--t) * -1);
  }

  /* ===== 手机 ===== */
  .phone {
    position: absolute; left: 210px; top: 460px;
    width: 660px; height: 1428px;
    border-radius: 72px; overflow: hidden;
    box-shadow: 0 8px 24px rgba(60, 40, 25, 0.08), 0 40px 90px rgba(60, 40, 25, 0.15);
    transform-origin: 330px 250px;
    animation-name: phoneIn;
  }
  .phone img { display: block; width: 660px; height: auto; }

  @keyframes phoneIn {
    0%, 15.5% { transform: translateY(170px) scale(0.965); opacity: 0; }
    21%       { transform: translateY(0) scale(1); opacity: 1; }
    32%       { transform: translateY(0) scale(1); opacity: 1; }
    46%       { transform: scale(1.52); opacity: 1; }
    63%       { transform: scale(1.58); opacity: 1; }
    66.4%     { transform: scale(1.58); opacity: 1; }
    66.9%     { transform: scale(1.58); opacity: 0; }
    100%      { transform: scale(1.58); opacity: 0; }
  }

  /* ===== 首屏大字 ===== */
  .hero {
    position: absolute; left: 0; right: 0; top: 640px;
    text-align: center;
    animation-name: heroOut;
  }
  .hero h1 {
    font-family: var(--serif);
    font-size: 138px; font-weight: 500; line-height: 1.3;
    letter-spacing: 0.04em;
  }
  .hero h1 em { font-style: normal; color: #a9a094; }
  .hero .bar {
    width: 78px; height: 3px; background: var(--red);
    margin: 48px auto 0; border-radius: 2px;
  }
  @keyframes heroOut {
    0%      { opacity: 0; transform: translateY(30px); }
    7%      { opacity: 1; transform: translateY(0); }
    9.5%    { opacity: 1; transform: translateY(0); }
    12.5%   { opacity: 0; transform: translateY(-40px); }
    100%    { opacity: 0; transform: translateY(-40px); }
  }

  /* ===== 推近字幕 ===== */
  .zoomcap {
    position: absolute; left: 80px; right: 80px; top: 30px;
    text-align: center; opacity: 0;
    animation-name: zoomCap;
  }
  .zoomcap .k {
    font-size: 28px; letter-spacing: 0.3em; color: var(--red);
    margin-bottom: 18px;
  }
  .zoomcap .big {
    font-family: var(--serif); font-size: 70px; font-weight: 500;
    line-height: 1.34; letter-spacing: 0.03em;
  }
  .zoomcap .big em { font-style: normal; color: #a9a094; }
  @keyframes zoomCap {
    0%, 37%  { opacity: 0; transform: translateY(18px); }
    45%      { opacity: 1; transform: translateY(0); }
    63%      { opacity: 1; transform: translateY(0); }
    66%      { opacity: 0; transform: translateY(-14px); }
    100%     { opacity: 0; }
  }

  /* ===== 隐私 ===== */
  .privacy {
    position: absolute; inset: 0;
    animation-name: pvOut;
  }
  @keyframes pvOut {
    0%, 88%  { opacity: 1; }
    91%      { opacity: 0; }
    100%     { opacity: 0; }
  }
  /* 遮罩层单独淡入：先盖住手机，再上文字 */
  .pv-bg {
    position: absolute; inset: 0;
    background: var(--paper);
    opacity: 0;
    animation-name: pvBg;
  }
  @keyframes pvBg {
    0%, 62.5% { opacity: 0; }
    66.2%     { opacity: 1; }
    100%      { opacity: 1; }
  }
  .privacy .inner {
    opacity: 0;
    animation-name: innerIn;
  }
  @keyframes innerIn {
    0%, 65.8% { opacity: 0; transform: translateY(14px); }
    70%       { opacity: 1; transform: translateY(0); }
    100%      { opacity: 1; transform: translateY(0); }
  }

  .privacy .inner {
    position: absolute; left: 120px; right: 120px; top: 560px;
    animation-duration: 17s; animation-fill-mode: both;
    animation-play-state: paused;
    animation-timing-function: cubic-bezier(0.22, 0.61, 0.36, 1);
    animation-delay: calc(var(--t) * -1);
  }
  .privacy .ttl {
    font-family: var(--serif); font-size: 88px; line-height: 1.34;
    letter-spacing: 0.04em; margin-bottom: 76px; text-align: center;
  }
  .privacy .ttl em { font-style: normal; color: #a9a094; }

  .item {
    display: flex; align-items: baseline;
    animation-duration: 17s;
    animation-fill-mode: both;
    animation-play-state: paused;
    animation-timing-function: cubic-bezier(0.22, 0.61, 0.36, 1);
    animation-delay: calc(var(--t) * -1);
    padding: 36px 0 34px;
    border-top: 1px solid #e8e1d7;
    animation-name: itemIn;
  }
  .item:last-child { border-bottom: 1px solid #e8e1d7; }
  .item i {
    font-style: normal; font-family: var(--serif);
    font-size: 32px; color: var(--red); width: 96px; flex: none;
  }
  .item span { font-size: 54px; letter-spacing: 0.05em; }

  @keyframes itemIn {
    0%, 70.5% { opacity: 0; transform: translateY(26px); }
    76%       { opacity: 1; transform: translateY(0); }
    100%     { opacity: 1; transform: translateY(0); }
  }
  .i2 { animation-delay: calc(var(--t) * -1 + 0.32s); }
  .i3 { animation-delay: calc(var(--t) * -1 + 0.64s); }

  /* ===== 尾屏 ===== */
  .end {
    position: absolute; left: 0; right: 0; top: 790px;
    text-align: center; opacity: 0;
    animation-name: endIn;
  }
  .end h2 {
    font-family: var(--serif); font-size: 100px; font-weight: 500;
    line-height: 1.32; letter-spacing: 0.04em;
  }
  .end h2 em { font-style: normal; color: #a9a094; }
  .end .bar { width: 70px; height: 3px; background: var(--red); margin: 44px auto 0; border-radius: 2px; }
  .end .name {
    margin-top: 52px; font-family: var(--serif); font-size: 44px;
    letter-spacing: 0.45em; text-indent: 0.45em; color: var(--red);
  }
  .end .tip { margin-top: 26px; font-size: 30px; color: var(--ink-2); letter-spacing: 0.06em; }
  @keyframes endIn {
    0%, 89%   { opacity: 0; transform: translateY(22px); }
    94%       { opacity: 1; transform: translateY(0); }
    100%      { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<div class="stage">

  <div class="phone a17"><img src="../shots/main@2x.png" alt="" /></div>

  <div class="hero a17">
    <h1>一个日历<br /><em>没有别的。</em></h1>
    <div class="bar"></div>
  </div>

  <div class="zoomcap a17">
    <p class="big">不是某一天<br /><em>是一段时间</em></p>
  </div>

  <div class="privacy a17">
    <div class="pv-bg a17"></div>
    <div class="inner">
      <p class="ttl">数据不出<em>这台手机</em></p>
      <div class="item i1"><i>01</i><span>没有账号</span></div>
      <div class="item i2"><i>02</i><span>没有云端备份</span></div>
      <div class="item i3"><i>03</i><span>没有广告内购</span></div>
    </div>
  </div>

  <div class="end a17">
    <h2>一个日历<br /><em>没有别的。</em></h2>
    <div class="bar"></div>
    <p class="name">月历</p>
    <p class="tip">在小红书笔记下方的小工具卡片打开</p>
  </div>
</div>

<script>
  var t = parseFloat(location.hash.replace('#t=', '')) || 0;
  document.documentElement.style.setProperty('--t', t + 's');
</script>
</body>
</html>
